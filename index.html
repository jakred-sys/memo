    const photos=p.photos&amp;&amp;p.photos.length?`<div class="post-photos">${p.photos.map((ph,pi)=>`<img src="${ph}" alt="" onclick="openLightboxDirect('${ph}','${p.date}','',${pi},${p.photos.length})">`).join('')}</div>`:'';
    return`<div class="post-item"><div class="post-header"><span class="post-title" onclick="togglePostBody(${p.id})">${p.title}</span><span class="post-date">${fmtDate(p.date)}</span><button style="background:none;border:none;font-size:12px;color:var(--green);cursor:pointer;font-family:inherit;padding:4px 6px;font-weight:600" onclick="openEditPost(${p.id})">✎</button><button class="post-del" onclick="deleteBoardPost(${p.id})">✕</button></div>${photos}<div class="post-body" id="post-body-${p.id}">${p.body?p.body.replace(/</g,'&amp;lt;').replace(/\n/g,'<br>'):''}</div></div>`;

// ════ 탭 전환 ════
function switchTab(tab){
  if(tab!=='settings')prevTab=tab;
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  ['timeline','list','tree','flower','yearly','board'].forEach(t=>{const b=document.getElementById('nav-'+t);if(b){b.classList.toggle('active',t===tab);if(t==='flower')b.classList.toggle('flower-tab',t===tab);}});
  document.getElementById('topbar-title').textContent='🌙 달빛 농장';
  const hideTodo=['settings','yearly','list','tree','flower','board'];
  const ts=document.getElementById('todo-section');
  ts.classList.toggle('hidden',hideTodo.includes(tab));
  document.getElementById('scroll-area').scrollTop=0;
  if(tab==='timeline')renderTimeline();
  if(tab==='list')renderList();
  if(tab==='tree')renderTreeList();
  if(tab==='flower')renderFlowerList();
  if(tab==='yearly')renderYearly();
  if(tab==='board'){document.getElementById('board-date-sel').value=globalDate;renderBoard();}
  if(tab==='settings')renderSwatches();
}

// ════ 작물 정보 수정 ════
let editCropId=null;
function openEditCrop(e,id){e.stopPropagation();const c=crops.find(c=>c.id===id);if(!c)return;editCropId=id;const cropKey=c.kind?c.emoji+'|'+c.kind:c.emoji;document.getElementById('edit-crop-emoji').value=cropKey;document.getElementById('edit-crop-name').value=c.name;document.getElementById('edit-crop-date').value=c.planted;document.getElementById('edit-crop-modal').classList.remove('hidden');}
function saveEditCrop(){
  const c=crops.find(c=>c.id===editCropId);if(!c)return;const name=document.getElementById('edit-crop-name').value.trim();
  if(!name){showConfirm('입력 필요','작물 이름을 입력해주세요.',()=>{},'확인','var(--green)');return;}
  const ev=document.getElementById('edit-crop-emoji').value;const [ce,ck]=ev.includes('|')?ev.split('|'):[ev,ev];c.emoji=ce;c.kind=ck;c.name=name;c.planted=document.getElementById('edit-crop-date').value||c.planted;
  save();closeModal('edit-crop-modal');
  if(currentCropId===editCropId){document.getElementById('d-emoji').textContent=c.emoji;document.getElementById('d-name').textContent=c.name;document.getElementById('d-planted').textContent=`심은 날: ${fmtDate(c.planted)} · ${daysSince(c.planted)}`;}
  editCropId=null;renderList();
}
function openEditCropFromDetail(){const c=crops.find(c=>c.id===currentCropId);if(!c)return;editCropId=currentCropId;document.getElementById('edit-crop-emoji').value=c.emoji;document.getElementById('edit-crop-name').value=c.name;document.getElementById('edit-crop-date').value=c.planted;document.getElementById('edit-crop-modal').classList.remove('hidden');}
function deleteCrop(){const c=crops.find(c=>c.id===currentCropId);if(!c)return;showConfirm('작물 삭제',`"${c.emoji} ${c.name}" 작물을 삭제할까요?`,()=>{crops=crops.filter(c=>c.id!==currentCropId);save();showPrev();});}
function addCrop(){
  const name=document.getElementById('modal-name').value.trim();
  const val=document.getElementById('modal-emoji').value;
  const [emoji,kind]=val.includes('|')?val.split('|'):[val,val];
  const planted=document.getElementById('modal-date').value||globalDate;
  if(!name){showConfirm('입력 필요','작물 이름을 입력해주세요.',()=>{},'확인','var(--green)');return;}
  const id=crops.length>0?Math.max(...crops.map(c=>c.id))+1:1;
  crops.push({id,name,emoji,kind,planted,harvested:false,harvestDate:'',yieldNote:'',entries:[]});
  save();document.getElementById('modal-name').value='';closeModal('add-modal');renderList();
}

// ════ 내보내기/가져오기 ════
function exportData(){
  const data={version:'8.3',exportDate:globalDate,crops,trees,flowers,todos,settings,boardPosts,cropTips,treeTips,flowerTips};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`달빛농장_${globalDate}.json`;a.click();URL.revokeObjectURL(url);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;const reader=new FileReader();
  reader.onload=ev=>{
    try{const data=JSON.parse(ev.target.result);
      if(data.crops){crops=data.crops;save();}if(data.trees){trees=data.trees;saveTrees();}
      if(data.flowers){flowers=data.flowers;saveFlowers();}
      if(data.todos){todos=data.todos;saveTodos();}if(data.settings){settings=data.settings;saveSettings();if(settings.bgColor)document.body.style.background=settings.bgColor;}
      if(data.boardPosts){boardPosts=data.boardPosts;saveBoard();}
      if(data.cropTips){cropTips=data.cropTips;saveCropTips();}
      if(data.treeTips){treeTips=data.treeTips;saveTreeTips();}
      if(data.flowerTips){flowerTips=data.flowerTips;saveFlowerTips();}
      renderTodos();renderSwatches();switchTab('timeline');
    }catch(err){showConfirm('오류','파일을 읽는 중 오류가 발생했습니다.',()=>{},'확인','var(--amber)');}
  };
  reader.readAsText(file);e.target.value='';
}
function resetAll(){showConfirm('데이터 초기화','모든 데이터가 삭제됩니다. 정말 초기화할까요?',()=>{crops=[];todos=[];trees=[];flowers=[];boardPosts=[];save();saveTodos();saveTrees();saveFlowers();saveBoard();renderTodos();switchTab('timeline');},'초기화','var(--red)');}

function confirmAction(){closeModal('confirm-modal');if(_confirmCallback){_confirmCallback();_confirmCallback=null;}}
function closeModal(id){document.getElementById(id).classList.add('hidden')}

].forEach(([e,n])=>TREE_EMOJI_NAME[e+'|'+n]=n);
function treeEmojiLabel(val){if(TREE_EMOJI_NAME[val])return TREE_EMOJI_NAME[val];const k=Object.keys(TREE_EMOJI_NAME).find(k=>k.startsWith(val+'|'));return k?TREE_EMOJI_NAME[k]:val;}

function setTreeSort(mode){

  document.getElementById('sort-date-btn').classList.toggle('active',mode==='date');

function renderTreeList(){
  const grid=document.getElementById('tree-grid');grid.innerHTML='';
  let sorted=[...trees];
  if(treeSortMode==='date'){sorted.sort((a,b)=>b.planted.localeCompare(a.planted));}
  else{sorted.sort((a,b)=>{const ka=a.kind||treeEmojiLabel(a.emoji)||a.name;const kb=b.kind||treeEmojiLabel(b.emoji)||b.name;return ka.localeCompare(kb,'ko');});}
  sorted.forEach(t=>{
    const kindName=t.kind||treeEmojiLabel(t.emoji)||t.name;
    const allPhotos=(t.entries||[]).flatMap(e=>e.photos||[]);
    const imgH=allPhotos.length>0
      ?`<div style="position:relative;width:100%;height:100%"><img src="${allPhotos[allPhotos.length-1]}" alt="" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:5px 6px 7px;text-align:center"><div style="font-size:12px;font-weight:700;color:#fff">${t.emoji} ${kindName}</div><div style="font-size:10px;color:rgba(255,255,255,.8);margin-top:1px">${t.name}</div></div></div>`
      :`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px"><span style="font-size:36px">${t.emoji}</span><span style="font-size:12px;font-weight:700;color:var(--tx);text-align:center">${kindName}</span><span style="font-size:10px;color:var(--tx3);text-align:center">${t.name}</span></div>`;
    const card=document.createElement('div');card.className='crop-card';
    const tHasTip=!!(treeTips&amp;&amp;treeTips[kindName]);
    card.innerHTML=`<div class="crop-img" onclick="showTreeDetail(${t.id})">${imgH}</div><div class="crop-info"><div class="crop-row"><span class="cname" onclick="showTreeDetail(${t.id})">${t.emoji} ${kindName}</span></div><div style="font-size:11px;color:var(--tx3);margin-top:1px;font-style:italic">${t.name}</div><div class="csub" style="margin-top:3px">${daysSinceTree(t.planted)}</div><div style="padding-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button onclick="openEditTree(event,${t.id})" style="background:none;border:none;font-size:11px;color:var(--tx3);cursor:pointer;font-family:inherit;padding:0">✎ 정보 수정</button><button onclick="event.stopPropagation();openTipModalForTree(${t.id})" class="tip-btn${tHasTip?' has-tip':''}">🌱 팁${tHasTip?' ✓':''}</button></div></div>`;
    grid.appendChild(card);
  });
  const ab=document.createElement('div');ab.className='add-crop-btn';
  ab.onclick=()=>{document.getElementById('tree-modal-date').value=globalDate;document.getElementById('add-tree-modal').classList.remove('hidden')};
  ab.innerHTML='<div class="add-icon">+</div><span>나무 추가</span>';
  grid.appendChild(ab);
}

function addTree(){
  const name=document.getElementById('tree-modal-name').value.trim();
  const sel=document.getElementById('tree-modal-emoji');const val=sel.value;const [emoji,kind]=val.includes('|')?val.split('|'):[val,val];
  const planted=document.getElementById('tree-modal-date').value||globalDate;
  if(!name){showConfirm('입력 필요','나무 이름을 입력해주세요.',()=>{},'확인','var(--green)');return;}
  const id=trees.length>0?Math.max(...trees.map(t=>t.id))+1:1;
  trees.push({id,name,emoji,kind,planted,entries:[]});
  saveTrees();document.getElementById('tree-modal-name').value='';closeModal('add-tree-modal');renderTreeList();
}

function showTreeDetail(id){
  currentTreeId=id;const t=trees.find(t=>t.id===id);
  document.getElementById('td-emoji').textContent=t.emoji;document.getElementById('td-name').textContent=t.name;
  document.getElementById('td-planted').textContent=`심은 날: ${fmtDate(t.planted)} · ${daysSinceTree(t.planted)}`;
  document.getElementById('tree-entry-date-sel').value=globalDate;
  treeResetNewEntryForm();renderTreeTipPreview(t);renderTreeEntries(t);
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-tree-detail').classList.add('active');
  document.getElementById('todo-section').classList.add('hidden');
  document.getElementById('scroll-area').scrollTop=0;
  document.getElementById('topbar-title').innerHTML=`<button onclick="showTreePrev()" style="background:none;border:none;font-size:15px;color:var(--green);font-family:inherit;font-weight:600;padding:0;cursor:pointer">← 뒤로</button>`;
}
function showTreePrev(){document.getElementById('tab-tree-detail').classList.remove('active');document.getElementById('topbar-title').textContent='🌙 달빛 농장';switchTab('tree');}

function renderTreeEntries(t){
  const list=document.getElementById('tree-entry-list');
  const sorted=[...(t.entries||[])].sort((a,b)=>b.date.localeCompare(a.date));
  if(!sorted.length){list.innerHTML='<div style="font-size:13px;color:var(--tx3);padding:4px 0 10px">아직 기록이 없어요.</div>';return;}
  list.innerHTML=sorted.map(entry=>{
    const oi=t.entries.findIndex(e=>e.date===entry.date);const photos=entry.photos||[];
    const strip=photos.length?'<div class="entry-photos-col">'+photos.map((ph,pi)=>`<div class="ephoto-wrap"><img src="${ph}" alt="" onclick="openTreeLightbox(${oi},${pi})"><button class="ephoto-del" onclick="deleteTreeEntryPhoto(${oi},${pi})">✕</button></div>`).join('')+'</div>':'<div class="no-photo-strip">사진 없음</div>';
    const memoH=entry.memo?entry.memo.replace(/</g,'&amp;lt;').replace(/\n/g,'<br>'):'';
    return`<div class="entry-slot"><div class="entry-slot-header"><span class="edate">${fmtDate(entry.date)}<span class="ecount">사진 ${photos.length}장</span></span><button class="edelete-all" onclick="deleteTreeEntry(${oi})">삭제</button></div>${strip}<div class="entry-memo-col">${memoH?`<div class="ememo-text">${memoH}</div>`:'<div class="ememo-empty">메모 없음</div>'}<button class="entry-edit-btn" onclick="openEditTreeEntry(${oi})">✎ 날짜·사진·메모 수정</button></div></div>`;
  }).join('');
}
function deleteTreeEntryPhoto(oi,pi){showConfirm('사진 삭제','이 사진을 삭제할까요?',()=>{const t=trees.find(t=>t.id===currentTreeId);t.entries[oi].photos.splice(pi,1);saveTrees();renderTreeEntries(t);});}
function deleteTreeEntry(idx){showConfirm('기록 삭제','이 날의 사진과 메모를 모두 삭제할까요?',()=>{const t=trees.find(t=>t.id===currentTreeId);t.entries.splice(idx,1);saveTrees();renderTreeEntries(t);});}
function openTreeLightbox(oi,pi){const t=trees.find(t=>t.id===currentTreeId);const e=t.entries[oi];openLightboxDirect(e.photos[pi],e.date,e.memo,pi,e.photos.length);}

function treePreviewPhotos(e){const files=Array.from(e.target.files);if(!files.length)return;let n=0;files.forEach(f=>{const r=new FileReader();r.onload=ev=>{treePendingPhotos.push(ev.target.result);n++;if(n===files.length)treeRenderPreviewArea();};r.readAsDataURL(f);});e.target.value='';}
function treeRenderPreviewArea(){const a=document.getElementById('tree-add-photos-col');if(!treePendingPhotos.length){a.innerHTML='<div class="no-preview-placeholder">📷</div>';return;}a.innerHTML=treePendingPhotos.map((ph,i)=>`<div class="preview-wrap"><img src="${ph}" alt=""><button class="preview-del" onclick="removeTreePendingPhoto(${i})">✕</button></div>`).join('');}
function removeTreePendingPhoto(i){treePendingPhotos.splice(i,1);treeRenderPreviewArea()}
function treeResetNewEntryForm(){treePendingPhotos=[];treeRenderPreviewArea();document.getElementById('tree-new-entry-memo').value=''}
function saveTreeEntry(){
  const date=document.getElementById('tree-entry-date-sel').value||globalDate;const memo=document.getElementById('tree-new-entry-memo').value.trim();
  if(!treePendingPhotos.length&amp;&amp;!memo){showConfirm('입력 필요','사진이나 메모 중 하나 이상 입력해주세요.',()=>{},'확인','var(--green)');return;}
  const t=trees.find(t=>t.id===currentTreeId);const ei=t.entries.findIndex(e=>e.date===date);
  if(ei>=0){showConfirm('기록 추가',`${fmtDate(date)}에 이미 기록이 있습니다. 추가할까요?`,()=>{t.entries[ei].photos.push(...treePendingPhotos);if(memo)t.entries[ei].memo=memo;saveTrees();treeResetNewEntryForm();renderTreeEntries(t);document.getElementById('scroll-area').scrollTop=0;},'추가','var(--green)');}
  else{t.entries.push({date,photos:[...treePendingPhotos],memo});saveTrees();treeResetNewEntryForm();renderTreeEntries(t);document.getElementById('scroll-area').scrollTop=0;}
}
function openEditTreeEntry(idx){
  const t=trees.find(t=>t.id===currentTreeId);const e=t.entries[idx];
  editingTreeEntryDate=e.date;editingTreeEntryIdx=idx;
  document.getElementById('edit-tree-entry-title').textContent='기록 수정';
  document.getElementById('edit-tree-entry-date-input').value=e.date;
  renderEditTreePhotosGrid(e.photos||[]);document.getElementById('edit-tree-entry-memo').value=e.memo||'';
  document.getElementById('edit-tree-entry-modal').classList.remove('hidden');
}
function renderEditTreePhotosGrid(photos){document.getElementById('edit-tree-photos-grid').innerHTML=photos.map((ph,i)=>`<div class="edit-photo-thumb"><img src="${ph}" alt=""><button class="edit-photo-del" onclick="editTreeDeletePhoto(${i})">✕</button></div>`).join('');}
function editTreeDeletePhoto(pi){const t=trees.find(t=>t.id===currentTreeId);const e=t.entries.find(e=>e.date===editingTreeEntryDate);if(!e)return;e.photos.splice(pi,1);saveTrees();renderEditTreePhotosGrid(e.photos);}
function editTreeAddPhotos(ev){const files=Array.from(ev.target.files);if(!files.length)return;let n=0;const t=trees.find(t=>t.id===currentTreeId);const e=t.entries.find(e=>e.date===editingTreeEntryDate);files.forEach(f=>{const r=new FileReader();r.onload=x=>{if(e)e.photos.push(x.target.result);n++;if(n===files.length){saveTrees();renderEditTreePhotosGrid(e?e.photos:[]);}};r.readAsDataURL(f);});ev.target.value='';}
function saveEditTreeEntry(){
  const t=trees.find(t=>t.id===currentTreeId);const e=t.entries.find(e=>e.date===editingTreeEntryDate);if(!e)return;
  const newDate=document.getElementById('edit-tree-entry-date-input').value;
  if(newDate&amp;&amp;newDate!==editingTreeEntryDate){const conflict=t.entries.find(en=>en.date===newDate);if(conflict){showConfirm('날짜 중복',`${fmtDate(newDate)}에 이미 기록이 있어요.`,()=>{},'확인','var(--amber)');return;}e.date=newDate;editingTreeEntryDate=newDate;}
  e.memo=document.getElementById('edit-tree-entry-memo').value.trim();
  saveTrees();closeModal('edit-tree-entry-modal');renderTreeEntries(t);
}
function openEditTree(e,id){e.stopPropagation();const t=trees.find(t=>t.id===id);if(!t)return;editTreeId=id;document.getElementById('edit-tree-emoji').value=t.emoji;document.getElementById('edit-tree-name').value=t.name;document.getElementById('edit-tree-date').value=t.planted;document.getElementById('edit-tree-modal').classList.remove('hidden');}
function openEditTreeFromDetail(){const t=trees.find(t=>t.id===currentTreeId);if(!t)return;editTreeId=currentTreeId;const treeKey=t.kind?t.emoji+'|'+t.kind:t.emoji;document.getElementById('edit-tree-emoji').value=treeKey;document.getElementById('edit-tree-name').value=t.name;document.getElementById('edit-tree-date').value=t.planted;document.getElementById('edit-tree-modal').classList.remove('hidden');}

}
function deleteTree(){const t=trees.find(t=>t.id===currentTreeId);if(!t)return;showConfirm('나무 삭제',`"${t.emoji} ${t.name}" 나무를 삭제할까요?`,()=>{trees=trees.filter(t=>t.id!==currentTreeId);saveTrees();showTreePrev();});}

function renderFlowerList(){
  const grid=document.getElementById('flower-grid');grid.innerHTML='';

function checkAutoSaveOnOpen(){
  const lastSave=localStorage.getItem(AUTO_SAVE_KEY)||'';
  const today=getTodayKST();
  const now=new Date();const kst=new Date(now.getTime()+9*60*60*1000);
  const yesterdayKST=new Date(kst.getTime()-86400000).toISOString().slice(0,10);
  if(lastSave!==today&amp;&amp;lastSave!==yesterdayKST&amp;&amp;lastSave!==''){setTimeout(()=>autoSaveNow(),3000);}
}
function scheduleAutoSave(){
  function msUntilMidnightKST(){const now=new Date();const kst=new Date(now.getTime()+9*60*60*1000);const midnight=new Date(kst);midnight.setUTCHours(15,0,0,0);if(midnight<=kst)midnight.setUTCDate(midnight.getUTCDate()+1);return midnight-now;}
  function tick(){const ms=msUntilMidnightKST();setTimeout(()=>{autoSaveNow();setTimeout(tick,1000);},ms);}
  tick();
}

function renderStars(rating, color="#FFB800") {
  rating = parseInt(rating) || 0;
  return [1,2,3,4,5].map(i => `<span style="color:${i<=rating?color:'#ddd'}">${i<=rating?'★':'☆'}</span>`).join('');
}
// 별점 인라인 텍스트
function starsText(rating) {
  rating = parseInt(rating) || 0;
  return '★'.repeat(rating) + '☆'.repeat(5-rating);
}
// 해당 테마+상태에서 별점 표시 여부
function shouldShowStar(themeId, status) {
  const theme = themes.find(t => t.id === themeId);
  if(theme?.format === "review") return status === REVIEW_STATUSES[1];
  return STAR_THEMES[themeId]?.includes(status) ?? false;
}

history.pushState({view:"home"},""  );

  if(document.getElementById("car-overlay").classList.contains("on")){document.getElementById("car-overlay").classList.remove("on");document.querySelector(".car-card")?.focus();return;}
  if(document.getElementById("farm-overlay")?.classList.contains("on")){closeFarmApp();return;}
  if(showModal){showModal=false;modalEditId=null;render();history.pushState({},""  );return;}

  if(showAddTheme){showAddTheme=false;render();history.pushState({},""  );return;}
  if(pinModal){pinModal=null;pinError="";render();history.pushState({},""  );return;}
  if(pendingDelete||pendingThemeDelete){pendingThemeDelete=null;pendingDelete=null;render();history.pushState({},""  );return;}
  if(view==="detail"){view="themes";activeTheme=null;filterStatus="전체";showSearch=false;searchText="";showAllList=false;expandedRegions={};saveViewState();render();history.pushState({},""  );return;}
  if(view==="themes"){view="home";saveViewState();render();history.pushState({},""  );return;}

function render(){
  document.getElementById("app").innerHTML=buildApp();
  bind();
  initStickyHeights();
  if(showSearch){const inp=document.getElementById("srch-inp");if(inp)inp.focus();}
}

function initStickyHeights(){
  document.querySelectorAll(".sticky-ta").forEach(ta=>{
    ta.style.height="auto";
    if(ta.value.trim()){ta.style.height=Math.min(ta.scrollHeight,220)+"px";}
    else{ta.style.height="42px";}
  });
}

function renderListOnly(){
  const la=document.getElementById("list-area");if(!la)return;
  const theme=themes.find(t=>t.id===activeTheme);if(!theme)return;
  const filtered=getFiltered();
  const isRegion=REGION_THEMES.includes(activeTheme);
  la.innerHTML=isRegion?buildRegionGroups(filtered,theme):buildMemoListHTML(filtered,theme);
  bindListBtns();
}

function isMemoBoard(theme){
  return !!theme && theme.format!=="review" &&
    !["travel","restaurant","movie"].includes(theme.id);
}

function memoPhoto(m){
  return typeof m.photo === "string" && /^data:image\/jpeg;base64,[a-z0-9+/=]+$/i.test(m.photo) ? m.photo : "";
}

function boardMetadata(m){
  const labels = [
    m.pinned ? "📌 상단 고정" : "",
    m.important ? "★ 중요" : "",
    m.category,
    ...(Array.isArray(m.tags) ? m.tags.map(tag => "#" + tag) : [])
  ].filter(Boolean);
  return labels.length ? `<div class="mc-meta">${labels.map(label=>`<span>${esc(label)}</span>`).join("")}</div>` : "";
}

function getFiltered(){
  const board=isMemoBoard(themes.find(t=>t.id===activeTheme));
  const query=searchText.toLocaleLowerCase("ko").trim();
  const results=(memos[activeTheme]||[]).filter(m=>{
    const ms=filterStatus==="전체"||(m.status||"")===filterStatus;
    const mt=!searchText||(m.title||"").includes(searchText)||(m.note||"").includes(searchText);
    if(board){
      const tags=Array.isArray(m.tags)?m.tags:[];
      return [m.title,m.note,m.category,...tags].some(value=>String(value||"").toLocaleLowerCase("ko").includes(query));
    }
    return ms&&mt;
  });
  if(board) results.sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned));
  return results;
}

function buildApp(){
  let body="";
  if(view==="home")     body=buildHome();
  if(view==="themes")   body=buildThemeGrid();
  if(view==="detail")   body=buildDetailView();
  if(view==="settings") body=buildSettings();
  return buildHeader()+body
    +(showAddTheme?buildThemeModal():"")
    +(showModal?buildMemoModal():"")
    +(showViewModal&&viewMemoData?buildViewModal():"")
    +(pendingDelete||pendingThemeDelete?buildConfirm():"")
    +(pinModal?buildPinModal():"");
}

function buildStickyNote(tid){
  const note=stickyNotes[tid]||"";
  return `<div class="sticky-wrap"><div class="sticky-box">
    <div class="sticky-hdr"><span class="sticky-hdr-title">📌 고정 메모</span><span class="sticky-hdr-hint">자동저장</span></div>
    <textarea class="sticky-ta" id="sticky-ta-${tid}" placeholder="중요한 내용을 여기에 적어두세요..."
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,220)+'px'"
      onblur="saveStickyTA('${tid}',this.value)"
    >${esc(note)}</textarea>
  </div></div>`;
}
function saveStickyTA(tid,val){stickyNotes[tid]=val;saveSticky();}

function buildHome(){
  const all=memos["daily"]||[],pend=all.filter(m=>m.status!=="완료"),done=all.filter(m=>m.status==="완료");
  const flt=arr=>arr.filter(m=>!searchText||(m.title||"").includes(searchText)||(m.note||"").includes(searchText));
  const fp=flt(pend),fd=flt(done);
  let html=buildStickyNote("home");
  html+=`<div class="todo-board">`;
  html+=`<div class="board-head"><span class="board-title">${esc(themes.find(t=>t.id==="daily")?.name||"할 일")}</span><span class="board-count">미완료 ${pend.length}개</span></div>`;
  const catOpts=themes.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");
  const defT=themes[0];
  if(!defT)return html+`<div class="no-todo">테마 탭에서 새 테마를 추가해 주세요.</div></div>`;
  html+=`<div class="todo-input-row"><input type="text" id="todo-inp" placeholder="할 일을 입력하세요..." maxlength="80" autocomplete="off"><button class="btn-tadd" id="btn-tadd">추가</button></div>
    <div class="todo-cat-row">
      <div class="cat-pick"><span style="font-size:12px;color:#888">📂</span><select id="todo-cat">${catOpts}</select></div>
      <select class="status-pick" id="todo-status" style="background:${defT.bg};color:${defT.color};border-color:${defT.color}40">${defT.statusOptions.map(s=>`<option value="${s}">${s}</option>`).join("")}</select>
      <input type="date" class="date-pick" id="todo-date" value="${TODAY}">
    </div>`;
  if(!fp.length&&!searchText){html+=`<div class="no-todo">등록된 내용이 없어요.</div>`;}
  else{
    (showAllPend?fp:fp.slice(0,SHOW_MAX)).forEach(m=>{html+=buildTodoItem(m);});
    if(fp.length>SHOW_MAX) html+=`<button class="more-btn" id="btn-more-pend">${showAllPend?"▲ 접기":`▼ 더보기 (${fp.length-SHOW_MAX}개)`}</button>`;
  }
  if(fd.length){
    html+=`<div class="tsec">완료됨 (${fd.length})</div>`;
    (showAllDone?fd:fd.slice(0,SHOW_MAX)).forEach(m=>{html+=buildTodoItem(m);});
    if(fd.length>SHOW_MAX) html+=`<button class="more-btn" id="btn-more-done">${showAllDone?"▲ 접기":`▼ 더보기 (${fd.length-SHOW_MAX}개)`}</button>`;
  }
  html+=`</div><div style="height:40px"></div>`;
  return html;
}

function buildTodoItem(m){
  const isDone=m.status==="완료";
  if(todoEditId===m.id) return `<div class="titem"><div class="tcb${isDone?" done":""}" data-check="${m.id}"></div>
    <div class="tedit-row"><input class="tedit-input" id="tedit-inp" value="${esc(m.title)}" maxlength="80"
      onkeydown="if(event.key==='Enter')commitEdit('${m.id}');if(event.key==='Escape')cancelEdit()">
      <button class="tedit-save" onclick="commitEdit('${m.id}')">저장</button>
      <button class="tedit-cancel" onclick="cancelEdit()">취소</button></div></div>`;
  const st=themes.find(t=>t.id!=="daily"&&(memos[t.id]||[]).some(x=>x.id===m.id));
  const catBadge=st?`<span class="tcat-badge" style="background:${st.bg};color:${st.color}">${esc(st.name)}</span>`:"";
  return `<div class="titem" id="titem-${m.id}">
    <div class="tcb${isDone?" done":""}" data-check="${m.id}"></div>
    <div class="ttext-wrap"><div class="ttxt${isDone?" done":""}">${esc(m.title)}</div>
      <div class="tmeta"><span class="tdate">${m.date||""}</span>${catBadge}</div></div>
    <div class="tactions"><button data-edit-todo="${m.id}">✎</button><button data-del-todo="${m.id}">✕</button></div>
  </div>`;
}

function openCarApp(){
  const frame=document.getElementById("car-iframe");
  document.getElementById("car-overlay").classList.add("on");
  const openEditor=()=>{
    history.pushState({car:true},"");
    frame.contentWindow.dispatchEvent(new Event("new-maintenance"));
  };
  if(!frame.hasAttribute("srcdoc")){
    frame.addEventListener("load",openEditor,{once:true});
    frame.srcdoc=document.getElementById("car-source").content.firstElementChild.value;
  }else if(frame.contentDocument?.readyState==="complete")openEditor();
}

function openFarmApp(){
  const ov=document.getElementById("farm-overlay");
  const ifr=document.getElementById("farm-iframe");
  if(!ifr.hasAttribute("srcdoc")){
    ifr.srcdoc=document.getElementById("farm-source").content.firstElementChild.value;
  }
  ov.classList.add("on");
  history.pushState({farm:true},"");
}
function closeFarmApp(){
  document.getElementById("farm-overlay").classList.remove("on");
}

function buildDetailView(){
  const theme=themes.find(t=>t.id===activeTheme);
  const isRegion=REGION_THEMES.includes(activeTheme);
  const filtered=getFiltered();
  const hasStatus=!isMemoBoard(theme)&&theme.statusOptions?.length;
  let html=`<div class="memo-view">`;
  if(hasStatus){
    const tabs=["전체",...theme.statusOptions].map(s=>`<button class="tab-btn${filterStatus===s?" on":""}" data-tab="${s}" style="${filterStatus===s?`background:${theme.color}`:""}"> ${s}</button>`).join("");
    html+=`<div class="tabs-row">${tabs}</div>`;
  }
  html+=`</div>`;
  html+=buildStickyNote(activeTheme);
  html+=`<div class="memo-view" style="padding-top:4px;padding-bottom:80px"><div id="list-area">`;
  html+=isRegion?buildRegionGroups(filtered,theme):buildMemoListHTML(filtered,theme);
  html+=`</div></div>`;
  return html;
}

function buildMemoItem(m, theme) {
  if(isMemoBoard(theme)){
    const photo=memoPhoto(m);
    return `<div class="mc mc-board${m.pinned?" mc-pinned":""}">
      <div class="mc-info" data-view="${esc(m.id)}">
        ${photo?`<img class="mc-photo" src="${photo}" alt="첨부 사진" loading="lazy">`:""}
        <div class="mc-title">${esc(m.title)}</div>
        ${m.note?`<div class="mc-preview">${esc(m.note)}</div>`:""}
        ${boardMetadata(m)}
        <span class="mc-date">${esc(m.date)}</span>
      </div>
      <div class="mc-acts"><button data-edit="${esc(m.id)}" aria-label="수정">✏️</button><button data-delete="${esc(m.id)}" aria-label="삭제">🗑️</button></div>
    </div>`;
  }
  const photo=memoPhoto(m);
  const isWatchedTheme = activeTheme === "movie";
  const watched = isWatchedTheme && m.status === "봤다";
  const hasStar = shouldShowStar(activeTheme, m.status) && parseInt(m.rating||0) > 0;
  const starsHtml = hasStar ? `<div class="mc-stars-inline">${starsText(m.rating)}</div>` : '';
  return `<div class="mc">
    <div class="mc-info" data-view="${m.id}">
      ${photo?`<img class="mc-photo" src="${photo}" alt="첨부 사진" loading="lazy">`:""}
      <div class="mc-title${watched?" watched":""}">${esc(m.title)}</div>
      ${starsHtml}
    </div>
    <span class="mc-date">${m.date||""}</span>
    <div class="mc-acts"><button data-edit="${m.id}">✏️</button><button data-delete="${m.id}">🗑️</button></div>
  </div>`;
}

function buildMemoListHTML(filtered,theme){
  if(!filtered.length) return `<div class="empty"><div class="et">아직 메모가 없어요</div><div class="es">+ 추가 버튼으로 등록하세요</div></div>`;
  const show=showAllList?filtered:filtered.slice(0,LIST_MAX);
  let html=`<div class="memo-list">${show.map(m=>buildMemoItem(m,theme)).join("")}</div>`;
  if(filtered.length>LIST_MAX){
    html+=`<button class="list-more-btn" id="btn-list-more">${showAllList?"▲ 접기":`▼ 더보기 (${filtered.length-LIST_MAX}개 더)`}</button>`;
  }
  return html;
}

function buildRegionGroups(filtered,theme){
  if(!filtered.length) return `<div class="empty"><div class="et">아직 메모가 없어요</div><div class="es">+ 추가 버튼으로 등록하세요</div></div>`;
  const ro=regionOrders[activeTheme]||{};
  const groups={};
  filtered.forEach(m=>{const r=(m.region||"지역 미입력").trim()||"지역 미입력";if(!groups[r])groups[r]=[];groups[r].push(m);});
  const keys=Object.keys(groups).sort((a,b)=>{
    if(a==="지역 미입력")return 1;if(b==="지역 미입력")return -1;
    const oa=ro[a]!==undefined?ro[a]:9999,ob=ro[b]!==undefined?ro[b]:9999;
    return oa!==ob?oa-ob:a.localeCompare(b,"ko");
  });
  const expSet=expandedRegions[activeTheme]||new Set();
  let html=`<div class="region-group">`;
  keys.forEach(r=>{
    const items=groups[r],isExp=expSet.has(r);
    const orderLabel=ro[r]!==undefined?` <span style="font-size:10px;color:#bbb;background:#f0ede6;padding:1px 6px;border-radius:8px">No.${ro[r]}</span>`:"";
    html+=`<div class="region-hdr"><span>📍</span><span class="region-hdr-name">${esc(r)}${orderLabel}</span><span class="region-hdr-count">${items.length}곳</span><div class="region-divider"></div></div>`;
    const show=isExp?items:items.slice(0,REGION_MAX);
    html+=`<div class="memo-list">${show.map(m=>buildMemoItem(m,theme)).join("")}`;
    if(items.length>REGION_MAX){
      html+=`<button class="region-more-btn" data-region-more="${esc(r)}">${isExp?"▲ 접기":`▼ 더보기 (${items.length-REGION_MAX}개 더)`}</button>`;
    }
    html+=`</div>`;
  });
  html+=`</div>`;
  return html;
}

function buildViewModal(){
  const m=viewMemoData;
  const theme=themes.find(t=>t.id===activeTheme);
  if(!m||!theme) return "";
  const hasStar = shouldShowStar(activeTheme, m.status);
  const starsHtml = hasStar ? `<div class="vm-stars">${renderStars(m.rating||0)}</div>` : '';
  let fieldsHtml = '';
  (theme.fields||[]).forEach(f => {
    if(m[f.key] && !(isMemoBoard(theme)&&f.key==="category")) fieldsHtml += `<div class="vm-field"><span class="vm-field-lbl">${f.label}</span><span class="vm-field-val">${esc(m[f.key])}</span></div>`;
  });
  const noteHtml = (m.note||"").trim() ? `<div class="vm-note-box">${esc(m.note)}</div>` : '';
  return `<div class="vm-bg" id="vm-bg"><div class="vm-box">
    <div class="modal-handle"></div>
    <div class="vm-head">
      <span class="vm-title">${esc(m.title)}</span>
    </div>
    <div class="vm-badge-row">
      ${m.status?`<span class="vm-status" style="background:${theme.bg};color:${theme.color}">${esc(m.status)}</span>`:""}
      ${starsHtml}
      ${m.date?`<span style="font-size:12px;color:#bbb">${esc(m.date)}</span>`:""}
    </div>
    ${fieldsHtml?`<div class="vm-field-list">${fieldsHtml}</div>`:""}
    ${isMemoBoard(theme)?boardMetadata(m):""}
    ${memoPhoto(m)?`<img class="board-photo" src="${memoPhoto(m)}" alt="첨부 사진">`:""}
    ${noteHtml}
    <div class="vm-btns">
      <button class="vm-close-btn" id="btn-vm-close">닫기</button>
      <button class="vm-edit-btn" id="btn-vm-edit">✏️ 수정</button>
    </div>
  </div></div>`;
}

function submitPin(){

  if(val.length<4){pinError="4자리를 입력해주세요";render();setTimeout(()=>document.getElementById("pin-inp")?.focus(),30);return;}

  if(action==="setup"){locks[themeId]=val;saveLocks();pinModal=null;pinError="";showToast("🔒 잠금 설정 완료");render();}
  else if(action==="enter"){

    else{pinError="비밀번호가 틀렸어요";render();setTimeout(()=>document.getElementById("pin-inp")?.focus(),30);}
  } else {
    if(locks[themeId]===val){delete locks[themeId];saveLocks();pinModal=null;pinError="";showToast("🔓 잠금 해제 완료");render();}
    else{pinError="비밀번호가 틀렸어요";render();setTimeout(()=>document.getElementById("pin-inp")?.focus(),30);}
  }
}
async function compressBoardPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const image=new Image();
    image.src=url;
    await image.decode();
    const scale=Math.min(1,1000/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    const ctx=canvas.getContext("2d",{alpha:false});
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(image,0,0,canvas.width,canvas.height);
    return canvas.toDataURL("image/jpeg",0.76);
  }finally{URL.revokeObjectURL(url);}
}

async function saveMemoModal(){
  const title=document.getElementById("mm-title")?.value?.trim();if(!title)return;
  const note=document.getElementById("mm-note")?.value||"";
  const date=document.getElementById("mm-date")?.value||TODAY;
  const theme=themes.find(t=>t.id===activeTheme);
  const statusEl=document.getElementById("mm-status");
  const status=statusEl?statusEl.value:(modalMemo.status||theme.defaultStatus||"");
  // 별점 저장
  const rating = shouldShowStar(activeTheme, status) ? (modalRating || parseInt(modalMemo.rating||0)) : 0;
  const extra={};
  document.querySelectorAll("[data-field]").forEach(inp=>{extra[inp.dataset.field]=inp.value;});
  if(REGION_THEMES.includes(activeTheme)){
    const regionVal=(document.getElementById("f-region")?.value||"").trim();
    const orderVal=document.getElementById("f-region-order")?.value||"";
    extra.region=regionVal;
    extra.regionOrder=orderVal?parseInt(orderVal,10):"";
  }
  const m={title,note,status,date,rating,...extra};
  const get=id=>document.getElementById(id);
  const button=get("btn-save-modal"), error=get("mm-board-error");
  if(button.disabled)return;
  const themeId=activeTheme, editId=modalEditId;
  const file=get("mm-photo").files[0];
  if(isMemoBoard(theme)){
    m.category=get("mm-category").value.trim();
    m.tags=[...new Set(get("mm-tags").value.split(/[,#]/).map(tag=>tag.trim()).filter(Boolean))];
    m.pinned=get("mm-pin").checked;
    m.important=get("mm-important").checked;
  }
  m.photo=get("mm-remove-photo")?.checked?"":memoPhoto(modalMemo);
  button.disabled=true;
  error.hidden=true;
  try{
    if(file){
      try{m.photo=await compressBoardPhoto(file);}
      catch{
        error.textContent="사진을 읽지 못했습니다. JPG 또는 PNG 사진으로 다시 시도해 주세요.";
        error.hidden=false;
        return;
      }
    }
    if(!button.isConnected)return;
    const current=memos[themeId]||[];
    const next=editId
      ? current.map(item=>item.id===editId?{...item,...m}:item)
      : [{...m,id:crypto.randomUUID?.()||Date.now().toString()},...current];
    const updated={...memos,[themeId]:next};
    localStorage.setItem("jaks_memos",JSON.stringify(updated));
    memos=updated;
    if(extra.region && extra.regionOrder!=="")setRegionOrder(themeId,extra.region,extra.regionOrder);
    showModal=false;modalEditId=null;modalRating=0;render();
  }catch{
    error.textContent="저장하지 못했습니다. 사진을 빼거나 브라우저 저장공간을 확인해 주세요.";
    error.hidden=false;
  }finally{button.disabled=false;}
}

  });
  $("todo-inp")?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addTodo();}});
  $("btn-tadd")?.addEventListener("click",addTodo);
  $("btn-more-pend")?.addEventListener("click",()=>{showAllPend=!showAllPend;render();});
  $("btn-more-done")?.addEventListener("click",()=>{showAllDone=!showAllDone;render();});
  document.querySelectorAll("[data-check]").forEach(cb=>{cb.addEventListener("click",()=>toggleTodo(cb.dataset.check));});
  document.querySelectorAll("[data-edit-todo]").forEach(btn=>{btn.addEventListener("click",()=>{todoEditId=btn.dataset.editTodo;render();setTimeout(()=>$("tedit-inp")?.focus(),30);});});
  document.querySelectorAll("[data-del-todo]").forEach(btn=>{btn.addEventListener("click",()=>deleteTodo(btn.dataset.delTodo));});

  $("btn-add-modal")?.addEventListener("click",()=>{
    const t=themes.find(t=>t.id===activeTheme);
    modalMemo={title:"",note:"",status:t.defaultStatus||"",date:TODAY,rating:0};
    (t.fields||[]).forEach(f=>{modalMemo[f.key]="";});
    modalEditId=null;modalRating=0;showModal=true;render();history.pushState({},""  );
  });
  $("btn-save-modal")?.addEventListener("click",saveMemoModal);
  $("btn-cancel-modal")?.addEventListener("click",()=>{showModal=false;modalEditId=null;modalRating=0;render();});
  $("modal-bg-memo")?.addEventListener("click",e=>{if(e.target.id==="modal-bg-memo"){showModal=false;modalEditId=null;modalRating=0;render();}});

  // 별점 버튼 (모달)
  document.querySelectorAll(".star-btn").forEach(btn=>{
    btn.addEventListener("click",()=>setModalRating(parseInt(btn.dataset.star)));
  });

  // 뷰 모달
  $("btn-vm-close")?.addEventListener("click",()=>{showViewModal=false;viewMemoData=null;render();});
  $("vm-bg")?.addEventListener("click",e=>{if(e.target.id==="vm-bg"){showViewModal=false;viewMemoData=null;render();}});
  $("btn-vm-edit")?.addEventListener("click",()=>{
    if(!viewMemoData) return;
    const m=viewMemoData;
    modalMemo={...m};modalEditId=m.id;modalRating=parseInt(m.rating||0);
    showViewModal=false;viewMemoData=null;showModal=true;render();history.pushState({},""  );
  });

  $("btn-cancel-del")?.addEventListener("click",()=>{pendingThemeDelete=null;pendingDelete=null;render();});
  $("confirm-bg")?.addEventListener("click",e=>{if(e.target.id==="confirm-bg"){pendingThemeDelete=null;pendingDelete=null;render();}});
  $("btn-confirm-del")?.addEventListener("click",()=>{
    if(pendingThemeDelete){
      const id=pendingThemeDelete;
      themes=themes.filter(theme=>theme.id!==id);
      delete memos[id];delete locks[id];delete stickyNotes[id];delete regionOrders[id];
      if(editingThemeId===id)editingThemeId=null;
      pendingThemeDelete=null;
      save();saveLocks();saveSticky();saveRegOrd();
      showToast("테마를 삭제했습니다");
    }else{
      memos[activeTheme]=(memos[activeTheme]||[]).filter(m=>m.id!==pendingDelete);
      pendingDelete=null;save();
    }
    render();
  });

  bindListBtns();
}

function bindListBtns(){
  document.querySelectorAll("[data-view]").forEach(el=>{
    el.addEventListener("click",()=>{
      const m=(memos[activeTheme]||[]).find(x=>x.id===el.dataset.view);
      if(m){viewMemoData={...m};showViewModal=true;render();history.pushState({},""  );}
    });
  });
  document.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const m=(memos[activeTheme]||[]).find(x=>x.id===btn.dataset.edit);
      if(m){modalMemo={...m};modalEditId=m.id;modalRating=parseInt(m.rating||0);showModal=true;render();history.pushState({},"");}
    });
  });
  document.querySelectorAll("[data-delete]").forEach(btn=>{btn.addEventListener("click",()=>{pendingDelete=btn.dataset.delete;render();});});
  document.getElementById("btn-list-more")?.addEventListener("click",()=>{showAllList=!showAllList;renderListOnly();});
  document.querySelectorAll("[data-region-more]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const r=btn.dataset.regionMore;
      if(!expandedRegions[activeTheme])expandedRegions[activeTheme]=new Set();
      if(expandedRegions[activeTheme].has(r))expandedRegions[activeTheme].delete(r);
      else expandedRegions[activeTheme].add(r);
      renderListOnly();
    });
  });
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

restoreViewState();
render();
</script>
</body>
</html>
