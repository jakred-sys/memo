<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jak's 메모</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif; background: #F5F3EE; color: #1a1a18; min-height: 100vh; font-size: 15px; }
.hdr { background: #fff; border-bottom: .5px solid rgba(0,0,0,.09); padding: 0 14px; display: flex; align-items: center; justify-content: space-between; height: 52px; position: sticky; top: 0; z-index: 20; }
.hdr-left { display: flex; align-items: center; gap: 7px; }

.app-name { font-size: 17px; font-weight: 800; letter-spacing: -.4px; }
.btn-hdr { border: none; border-radius: 9px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; padding: 6px 11px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.btn-save { background: #4A90E2; color: #fff; }
.btn-ghost { background: #f0ede6; color: #555; }
.btn-back { background: none; border: none; cursor: pointer; font-size: 20px; color: #555; padding: 4px 6px; border-radius: 8px; font-family: inherit; }
.btn-icon { background: none; border: none; cursor: pointer; font-size: 20px; padding: 4px 5px; border-radius: 8px; }
.btn-srch { background: none; border: 1.5px solid transparent; color: #888; border-radius: 9px; padding: 5px 8px; font-size: 15px; cursor: pointer; }

.btn-add-hdr { color: #fff; border: none; border-radius: 9px; padding: 6px 13px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.search-zone { background: #fff; border-bottom: .5px solid rgba(0,0,0,.07); padding: 8px 14px; position: sticky; top: 52px; z-index: 19; }
.search-inp { background: #f0ede6; border: .5px solid rgba(74,144,226,.4); border-radius: 12px; padding: 9px 14px; font-size: 14px; width: 100%; font-family: inherit; outline: none; }
.search-inp:focus { background: #fff; }
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; font-size: 13px; font-weight: 600; padding: 10px 22px; border-radius: 22px; z-index: 400; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }

.sticky-hdr { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.sticky-hdr-title { font-size: 11px; font-weight: 700; color: #B8860B; text-transform: uppercase; letter-spacing: .05em; flex: 1; }
.sticky-hdr-hint { font-size: 10px; color: #B8860B; opacity: .7; }
.sticky-ta { width: 100%; border: none; background: transparent; font-size: 13px; color: #555; font-family: inherit; outline: none; resize: none; line-height: 1.65; min-height: 42px; max-height: 220px; overflow-y: auto; }
.sticky-ta::placeholder { color: #C8B44A; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px,1fr)); gap: 12px; padding: 16px; }
.theme-card { border-radius: 16px; padding: 17px 14px; cursor: pointer; border: 1.5px solid transparent; transition: border-color .15s; position: relative; }
.theme-card:hover, .theme-card:focus-visible { border-color: var(--tc); }
button.theme-card { text-align:left; font:inherit; color:inherit; min-height:76px; }
button.theme-card .nm { display:block; font-size:16px; overflow-wrap:anywhere; padding-right:12px; }
button.theme-card .ct { display:block; color:#555c56; }
.theme-card .ic { font-size: 28px; margin-bottom: 7px; display: block; }
.theme-card .nm { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
.theme-card .ct { font-size: 12px; color: #999; }
.theme-card .lock-badge { position: absolute; top: 8px; right: 8px; font-size: 14px; }
.theme-card.car-card {background:linear-gradient(135deg,#204738,#3c6c50);color:#fff}
.theme-card.car-card .ct{color:#e3f2e6}
.car-overlay.on{display:flex;flex-direction:column;background:#244536}
.car-toolbar{padding:8px 12px}
.car-toolbar button{padding:8px 12px;color:white;background:transparent;border:1px solid #ffffff85;border-radius:8px;font:inherit;cursor:pointer}
.car-overlay iframe{flex:1;min-height:0}
.theme-card.farm-card { background: linear-gradient(135deg,#2b2f6b,#4a3f8c) !important; color:#fff; overflow:hidden; }
.theme-card.farm-card .nm { color:#fff; }
.theme-card.farm-card .ct { color:#d8d4f5; }
.theme-card.farm-card::after { content:"✨"; position:absolute; bottom:8px; right:10px; font-size:13px; opacity:.7; }
.farm-overlay { position:fixed; inset:0; z-index:9999; background:#000; display:none; }
.farm-overlay.on { display:block; }
.farm-overlay iframe { width:100%; height:100%; border:none; display:block; }
.farm-back-btn { position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); left:10px; z-index:10000; background:rgba(20,20,30,.72); color:#fff; border:none; border-radius:20px; padding:8px 14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:4px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
.add-card { border-radius: 16px; padding: 17px 14px; cursor: pointer; border: 1.5px dashed #ccc; background: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 108px; color: #bbb; gap: 5px; }
.todo-board { background: #fff; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 14px 15px; margin: 12px 14px 0; }
.board-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.board-title { font-size: 15px; font-weight: 700; }
.board-count { font-size: 12px; color: #aaa; }
.todo-input-row { display: flex; gap: 8px; margin-bottom: 4px; }
.todo-input-row input { flex: 1; border: .5px solid rgba(0,0,0,.16); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: #1a1a18; background: #f0ede6; font-family: inherit; outline: none; }
.todo-input-row input:focus { border-color: #4A90E2; background: #fff; }
.btn-tadd { background: #4A90E2; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; color: #fff; cursor: pointer; font-weight: 700; font-family: inherit; }
.todo-cat-row { display: flex; gap: 7px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.cat-pick { display: flex; align-items: center; gap: 4px; background: #f0ede6; border-radius: 8px; padding: 5px 4px 5px 9px; }
.cat-pick select { border: none; background: transparent; font-size: 12px; font-weight: 600; color: #444; outline: none; cursor: pointer; font-family: inherit; max-width: 120px; }
.status-pick { border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 600; outline: none; cursor: pointer; font-family: inherit; border: 1px solid transparent; }
.date-pick { border: .5px solid rgba(0,0,0,.14); border-radius: 8px; padding: 5px 8px; font-size: 12px; color: #666; outline: none; background: #f5f3ee; font-family: inherit; }
.titem { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: .5px solid rgba(0,0,0,.07); }
.titem:last-child { border-bottom: none; }
.tcb { width: 20px; height: 20px; border: 1.5px solid rgba(0,0,0,.22); border-radius: 5px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #fff; cursor: pointer; margin-top: 1px; }
.tcb.done { background: #4A90E2; border-color: #4A90E2; }
.tcb.done::after { content: '✓'; color: #fff; font-size: 12px; }
.ttext-wrap { flex: 1; min-width: 0; }
.ttxt { font-size: 14px; color: #1a1a18; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttxt.done { text-decoration: line-through; color: #aaa; }
.tmeta { display: flex; gap: 5px; align-items: center; margin-top: 2px; }
.tdate { font-size: 11px; color: #bbb; }
.tcat-badge { font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
.tactions button { background: none; border: none; color: #bbb; font-size: 15px; cursor: pointer; padding: 3px 5px; }
.tsec { font-size: 11px; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 4px; }
.more-btn { display: block; width: 100%; border: none; background: none; font-size: 13px; color: #4A90E2; cursor: pointer; padding: 9px 0 3px; font-family: inherit; text-align: left; font-weight: 600; }
.no-todo { font-size: 13px; color: #bbb; padding: 6px 0 2px; }
.tedit-row { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.tedit-input { flex: 1; border: .5px solid #4A90E2; border-radius: 8px; padding: 7px 10px; font-size: 14px; color: #1a1a18; background: #f0ede6; font-family: inherit; outline: none; min-width: 0; }
.tedit-save { background: #4A90E2; border: none; border-radius: 8px; padding: 7px 12px; font-size: 13px; color: #fff; cursor: pointer; font-weight: 700; font-family: inherit; white-space: nowrap; }
.tedit-cancel { background: none; border: .5px solid rgba(0,0,0,.18); border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #666; cursor: pointer; font-family: inherit; white-space: nowrap; }
.memo-view { padding: 0 14px; }
.tabs-row { display: flex; gap: 7px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
.tabs-row::-webkit-scrollbar { display: none; }
.tab-btn { border-radius: 20px; padding: 5px 13px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; border: 1.5px solid #ddd; background: #fff; color: #666; }
.tab-btn.on { color: #fff; border-color: transparent; }
.memo-list { background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.07); overflow: hidden; margin-bottom: 8px; }
.mc { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border-bottom: .5px solid rgba(0,0,0,.06); }
.mc:last-child { border-bottom: none; }
.mc-info { flex: 1; min-width: 0; cursor: pointer; }
.mc-title { font-size: 14px; font-weight: 500; color: #1a1a18; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-title.watched { text-decoration: line-through; color: #bbb; }
.mc-stars-inline { font-size: 11px; color: #FFB800; letter-spacing: 1px; margin-top: 1px; }
.mc-date { font-size: 11px; color: #ccc; white-space: nowrap; flex-shrink: 0; }
.mc-acts { display: flex; gap: 0; flex-shrink: 0; }
.mc-acts button { background: none; border: none; cursor: pointer; font-size: 13px; padding: 3px 5px; color: #ccc; }
.region-more-btn { display: block; width: 100%; border: none; background: none; font-size: 12px; color: #4A90E2; cursor: pointer; padding: 8px 13px; font-family: inherit; text-align: left; font-weight: 600; background: #fff; border-top: .5px solid rgba(0,0,0,.06); }
.list-more-btn { display: block; width: 100%; border: none; background: #fff; font-size: 13px; color: #4A90E2; cursor: pointer; padding: 10px 13px; font-family: inherit; text-align: left; font-weight: 600; border-radius: 0 0 14px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.07); margin-bottom: 8px; border-top: .5px solid rgba(0,0,0,.06); }
.region-group { }
.region-hdr { display: flex; align-items: center; gap: 7px; margin: 14px 0 6px; }
.region-hdr:first-child { margin-top: 8px; }
.region-hdr-name { font-size: 13px; font-weight: 700; color: #444; }
.region-hdr-count { font-size: 11px; color: #aaa; }
.region-divider { flex: 1; height: .5px; background: rgba(0,0,0,.1); }
.empty { text-align: center; padding: 40px 20px; color: #ccc; }
.empty .ei { font-size: 36px; margin-bottom: 10px; }
.empty .et { font-weight: 600; color: #bbb; margin-bottom: 4px; }
.empty .es { font-size: 13px; }
.settings-page { padding: 14px 14px 60px; }
.ss-section { background: #fff; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 14px; overflow: hidden; }
.ss-section-title { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .06em; padding: 12px 15px 8px; border-bottom: .5px solid rgba(0,0,0,.07); }
.st-row { padding: 12px 15px; border-bottom: .5px solid rgba(0,0,0,.06); }
.st-row:last-child { border-bottom: none; }
.st-main { display: flex; align-items: center; gap: 10px; }
.st-info { flex: 1; min-width: 0; }
.st-name { font-size: 15px; font-weight: 600; }
.st-sub { font-size: 11px; color: #aaa; margin-top: 1px; }
.st-btns { display: flex; gap: 5px; flex-shrink: 0; }
.st-btn { border: none; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
.st-btn-edit { background: #f0ede6; color: #555; }
.st-btn-lock-off { background: #f0ede6; color: #888; }
.st-btn-lock-on { background: #FFF0E8; color: #E8743B; }
.st-btn-del { background: #FDEAEA; color: #C0392B; }
.st-edit-area { margin-top: 10px; padding: 12px; background: #f8f7f4; border-radius: 10px; }
.st-edit-label { font-size: 11px; font-weight: 600; color: #888; margin-bottom: 5px; display: block; }
.st-edit-name { width: 100%; border: .5px solid rgba(0,0,0,.18); border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit; outline: none; background: #fff; margin-bottom: 10px; }
.st-edit-btns { display: flex; gap: 8px; }
.st-edit-btns button { flex: 1; border: none; border-radius: 9px; padding: 9px 0; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.st-save-btn { background: #4A90E2; color: #fff; }
.st-cancel-btn { background: #f0ede6; color: #555; }
.ss-btn-row { display: flex; align-items: center; padding: 13px 15px; border-bottom: .5px solid rgba(0,0,0,.06); cursor: pointer; gap: 10px; }
.ss-btn-row:last-child { border-bottom: none; }
.ss-row-icon { font-size: 18px; width: 26px; text-align: center; }
.ss-row-text { flex: 1; font-size: 14px; font-weight: 500; }
.ss-row-arrow { font-size: 14px; color: #ccc; }
.ss-danger { color: #C0392B; }
.ss-info-text { font-size: 12px; color: #aaa; line-height: 1.6; padding: 12px 15px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.modal-box { background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-width: 600px; padding: 20px 18px 36px; max-height: 88vh; overflow-y: auto; }
.modal-handle { width: 36px; height: 4px; background: rgba(0,0,0,.15); border-radius: 2px; margin: 0 auto 16px; }
.modal-ttl { font-weight: 700; font-size: 17px; margin-bottom: 16px; }
.f-row { margin-bottom: 11px; }
.f-lbl { font-size: 12px; font-weight: 600; color: #888; display: block; margin-bottom: 5px; }
.f-inp,.f-sel { width: 100%; border: .5px solid rgba(0,0,0,.16); border-radius: 9px; padding: 11px 12px; font-size: 15px; font-family: inherit; outline: none; background: #f5f3ee; color: #1a1a18; -webkit-appearance: none; }
.f-ta { width: 100%; border: .5px solid rgba(0,0,0,.16); border-radius: 9px; padding: 11px 12px; font-size: 15px; font-family: inherit; outline: none; background: #f5f3ee; min-height: 74px; resize: vertical; color: #1a1a18; }
.f-row-inline { display: flex; gap: 8px; }
.f-sort-inp { width: 72px; border: .5px solid rgba(0,0,0,.16); border-radius: 9px; padding: 11px 10px; font-size: 15px; font-family: inherit; outline: none; background: #f5f3ee; color: #1a1a18; text-align: center; flex-shrink: 0; }
.btn-ok { color: #fff; border: none; border-radius: 11px; padding: 13px 0; width: 100%; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 12px; font-family: inherit; }
.btn-sec { background: #f0ede6; color: #555; border: none; border-radius: 11px; padding: 12px 0; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit; }
/* Star rating */
.star-row { display: flex; gap: 2px; align-items: center; margin-top: 4px; }
.star-btn { font-size: 26px; cursor: pointer; background: none; border: none; padding: 2px 3px; line-height: 1; transition: transform .1s; }
.star-btn:active { transform: scale(1.2); }
.mc-stars-inline { font-size: 12px; color: #FFB800; letter-spacing: 1px; }
/* View modal */
.vm-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.vm-box { background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-width: 600px; padding: 20px 18px 36px; max-height: 90vh; overflow-y: auto; }
.vm-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.vm-title { font-size: 20px; font-weight: 800; color: #1a1a18; line-height: 1.3; flex: 1; }
.vm-badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.vm-status { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 20px; }
.vm-stars { font-size: 18px; color: #FFB800; letter-spacing: 2px; }
.vm-field-list { margin-bottom: 14px; }
.vm-field { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-bottom: .5px solid rgba(0,0,0,.06); }
.vm-field:last-child { border-bottom: none; }
.vm-field-lbl { font-size: 12px; font-weight: 700; color: #aaa; width: 60px; flex-shrink: 0; padding-top: 1px; }

.vm-edit-btn { flex: 1; background: #4A90E2; color: #fff; border: none; border-radius: 11px; padding: 13px 0; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.vm-close-btn { background: #f0ede6; color: #555; border: none; border-radius: 11px; padding: 13px 20px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
/* PIN */
.pin-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
.pin-modal { background: #fff; border-radius: 20px; width: 100%; max-width: 320px; padding: 28px 24px 24px; text-align: center; }
.pin-icon { font-size: 36px; margin-bottom: 10px; }
.pin-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.pin-sub { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; white-space: pre-line; }

.pin-error { font-size: 13px; color: #E24B4A; margin-bottom: 10px; min-height: 18px; }
.pin-btns { display: flex; gap: 8px; }
.pin-btns button { flex: 1; border: none; border-radius: 11px; padding: 13px 0; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.confirm-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: flex; align-items: center; justify-content: center; }

.confirm-box .ci { font-size: 24px; margin-bottom: 8px; }
.confirm-box .ct { font-weight: 700; margin-bottom: 4px; font-size: 16px; }
.confirm-box .cs { font-size: 13px; color: #999; margin-bottom: 16px; }
.confirm-btns { display: flex; gap: 8px; }
.confirm-btns button { flex: 1; border: none; border-radius: 11px; padding: 12px 0; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-del { background: #E24B4A; color: #fff; }
.theme-palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(42px,1fr));gap:5px;margin-top:6px}
.theme-palette input{appearance:none;-webkit-appearance:none;display:grid;place-items:center;width:100%;height:42px;margin:0;border:1px solid #0003;border-radius:8px;background:var(--swatch);color:#243c2d;cursor:pointer}
.theme-palette input:checked{border:2px solid currentColor}
.theme-palette input:checked::after{content:"✓";font-size:20px;font-weight:700}
.theme-palette input:focus-visible{outline:2px solid #294c37;outline-offset:2px}
.mc-preview{margin-top:5px;color:#575952;font-size:14px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.mc-board{align-items:flex-start}.mc-board .mc-info{min-width:0;overflow-wrap:anywhere}.mc-board.mc-pinned{border-color:#91a89a}
.mc-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:13px;color:#4e5a52}
.mc-meta span{background:#edf2ee;border-radius:12px;padding:2px 8px}
.mc-photo{float:left;width:62px;height:62px;object-fit:cover;border-radius:8px;margin-right:9px}

<template id="car-source"><textarea><!doctype html>

<style>

select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding:9px 30px 9px 12px;border-radius:9px}.metrics{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:20px;margin-top:25px}.metric+.metric{border-left:1px solid #ffffff2b;padding-left:20px}.metric span{display:block;font-size:.875rem;color:#d5eddd;margin-bottom:7px}.metric strong{font-weight:780;font-size:clamp(1.1rem,3.3vw,2.05rem);letter-spacing:-.045em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

@media(max-width:590px){.bar,main{padding-inline:16px}.bar{height:65px}main{padding-top:19px}.hero{padding:19px 16px;border-radius:17px}.metrics{grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.metric:first-child{grid-column:1/-1}.metric:nth-child(2){border:0;padding-left:0}.metric:nth-child(3){padding-left:10px}.metric:first-child strong{font-size:1.9rem}.history{margin-top:23px}.columns{display:none}.record{grid-template-columns:minmax(0,1fr) auto;padding:13px 13px;gap:4px 10px}.record:first-of-type{border-top:0}.record .work{grid-column:1;grid-row:1}.record time{grid-column:1;grid-row:2}.record .distance{grid-column:2;grid-row:2;text-align:right}.record .cost{grid-column:2;grid-row:1}.footer{gap:4px 12px}}

<body>
<header class="top"><div class="bar"><div class="brand"><span class="logo" aria-hidden="true"><i></i></span>나의 차계부</div><button id="add" class="primary">＋ 정비 기록</button></div></header>
<main>
  <section class="hero" aria-labelledby="summary-title">
    <div class="hero-top"><h1 id="summary-title">연도별 정비 내역</h1><select id="year" aria-label="조회 연도"></select></div>
    <div class="metrics">
      <div class="metric"><span>총 정비비</span><strong id="sum">0원</strong></div>
      <div class="metric"><span>정비 횟수</span><strong id="count">0건</strong></div>
      <div class="metric"><span>최근 정비일</span><strong id="last">—</strong></div>
    </div>
  </section>
  <section class="history" aria-labelledby="history-title">
    <div class="heading"><h2 id="history-title">정비 이력</h2><span id="matches" aria-live="polite"></span></div>
    <label class="tools"><span class="search-icon" aria-hidden="true"></span><input type="search" id="search" aria-label="정비 이력 검색" placeholder="정비 항목, 정비소, 메모 검색"></label>
    <div class="records">
      <div class="columns" aria-hidden="true"><span>정비 날짜</span><span>정비 내용</span><span>주행거리</span><span class="cost">결제 금액</span></div>
      <div id="rows"></div>
      <div id="empty" class="empty"><strong id="empty-title"></strong><p id="empty-text"></p></div>
    </div>
  </section>
  <div class="footer"><span id="storage-message">정비 기록은 이 브라우저에 저장됩니다.</span><button id="sample" class="ghost">예시 기록 보기</button></div>
</main>
<dialog id="editor" aria-labelledby="editor-title"><div class="dialog-inner">
  <div class="dialog-top"><h2 id="editor-title">정비 기록 추가</h2><button data-close class="close" aria-label="닫기">×</button></div>
  <form id="form">
    <div class="fields">
      <label class="field">정비 날짜<input name="date" type="date" required></label>
      <label class="field">결제 금액 (원)<input name="amount" type="number" inputmode="numeric" min="0" max="9999999999" step="1" placeholder="85000" required></label>
      <label class="field wide">정비 항목<input name="work" maxlength="120" placeholder="예: 엔진오일, 오일필터 교체" required></label>
      <label class="field"><span>주행거리 (km) <em>선택</em></span><input name="km" type="number" inputmode="numeric" min="0" max="9999999" step="1" placeholder="62400"></label>
      <label class="field"><span>정비소 <em>선택</em></span><input name="shop" maxlength="80" placeholder="정비소 이름"></label>
      <label class="field wide"><span>메모 <em>선택</em></span><textarea name="note" maxlength="2000" rows="3" placeholder="예: 다음 교체는 70,000km 전후">&lt;/textarea></label>
      <label class="field wide"><span>영수증 사진 <em>선택</em></span><input name="receipt" type="file" accept="image/*"></label>
      <div class="wide" id="existing-receipt" hidden><img id="editor-image" class="receipt" alt="저장된 영수증"><button id="remove-receipt" class="secondary" type="button">첨부 사진 제거</button></div>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" data-close class="secondary">취소</button><button id="save" class="primary">저장</button></div>
  </form>
</div></dialog>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="dialog-inner">
  <div class="dialog-top"><h2 id="viewer-title">정비 상세</h2><button data-close class="close" aria-label="닫기">×</button></div>
  <div id="detail" class="detail"></div>
  <div id="view-actions" class="dialog-actions"><button id="del" class="danger">삭제</button><button id="edit" class="primary">수정</button></div>
</div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
"use strict";

const byId = id => document.getElementById(id);
const year = byId("year");
const search = byId("search");
const editor = byId("editor");
const viewer = byId("viewer");
const form = byId("form");
const fields = form.elements;
const numbers = new Intl.NumberFormat("ko-KR");
const today = () => {
  const date = new Date();
  return [date.getFullYear(), date.getMonth() + 1, date.getDate()]
    .map(value => String(value).padStart(2, "0")).join("-");
};
const dateLabel = value => value.replaceAll("-", ".");

let database;
let records = [];
let sampleMode = false;
let previousYear;
let selectedRecord;
let editedRecord;
let removeReceipt = false;
let editorUrl;
let viewerUrl;
let writing = false;
let toastTimer;

function connect() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("my-car-care-notebook", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("services", { keyPath: "id" });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function operate(mode, operation) {
  return new Promise((resolve, reject) => {
    const transaction = database.transaction("services", mode);
    const request = operation(transaction.objectStore("services"));
    transaction.oncomplete = () => resolve(request.result);
    transaction.onabort = () => reject(transaction.error || request.error);
  });
}

function showToast(message) {
  const toast = byId("toast");
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3000);
}

function make(tag, content, className) {
  const element = document.createElement(tag);
  if (content !== undefined) element.textContent = content;
  if (className) element.className = className;
  return element;
}

function samples() {
  const current = today().slice(0, 4);
  return [
    { date: current + "-11-23", work: "엔진오일 및 오일필터 교체", km: 62400, amount: 85000, shop: "동네 카센터", note: "다음 교체는 70,000km 전후" },
    { date: current + "-08-07", work: "배터리 교체", km: 58100, amount: 140000, shop: "동네 카센터" },
    { date: current + "-03-15", work: "앞 브레이크 패드 교체", km: 51200, amount: 100000 }
  ];
}

function render(requestedYear = year.value) {
  const source = sampleMode ? samples() : records;
  const current = today().slice(0, 4);
  const years = [...new Set([current, ...source.map(record => record.date.slice(0, 4))])].sort().reverse();
  year.replaceChildren(...years.map(value => new Option(value + "년", value)));
  year.value = years.includes(requestedYear) ? requestedYear : current;

  const annual = source.filter(record => record.date.startsWith(year.value + "-"))
    .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  byId("sum").textContent = numbers.format(annual.reduce((total, record) => total + record.amount, 0)) + "원";
  byId("count").textContent = annual.length + "건";
  byId("last").textContent = annual.length ? dateLabel(annual[0].date) : "—";

  const terms = search.value.toLocaleLowerCase("ko").trim().split(/\s+/u).filter(Boolean);
  const matches = annual.filter(record => {
    const text = [record.work, record.shop, record.note].join(" ").toLocaleLowerCase("ko");
    return terms.every(term => text.includes(term));
  });
  byId("rows").replaceChildren(...matches.map(row));
  byId("matches").textContent = (terms.length ? "검색 결과 " : "") + matches.length + "건";
  byId("empty").hidden = matches.length !== 0;
  byId("empty-title").textContent = terms.length ? "검색 결과가 없습니다" : "아직 정비 기록이 없습니다";
  byId("empty-text").textContent = terms.length ? "검색어를 바꿔서 찾아보세요." : "정비 기록 버튼을 눌러 첫 기록을 남겨보세요.";
}

function row(record) {
  const button = make("button", undefined, "record");
  button.type = "button";
  const date = make("time", dateLabel(record.date));
  date.dateTime = record.date;
  const work = make("span", undefined, "work");
  work.append(make("strong", record.work));
  if (record.shop) work.append(make("small", record.shop));
  const distance = record.km == null ? "—" : numbers.format(record.km) + "km";
  button.append(date, work, make("span", distance, "distance"), make("span", numbers.format(record.amount) + "원", "cost"));
  button.addEventListener("click", () => showDetail(record));
  return button;
}

function showDetail(record) {
  selectedRecord = record;
  const list = make("dl");
  const data = [
    ["정비 날짜", dateLabel(record.date)],
    ["정비 항목", record.work],
    ["결제 금액", numbers.format(record.amount) + "원"],
    ["주행거리", record.km == null ? "" : numbers.format(record.km) + "km"],
    ["정비소", record.shop]
  ];
  for (const [label, value] of data) {
    if (value) list.append(make("dt", label), make("dd", value));
  }
  const detail = byId("detail");
  detail.replaceChildren(list);
  if (record.note) detail.append(make("p", record.note));
  if (record.receipt) {
    viewerUrl = URL.createObjectURL(record.receipt);
    const image = make("img", undefined, "receipt");
    image.src = viewerUrl;
    image.alt = "정비 영수증";
    detail.append(image);
  }
  byId("view-actions").hidden = sampleMode;
  viewer.showModal();
}

function openEditor(record) {
  editedRecord = record;
  removeReceipt = false;
  form.reset();
  fields.date.value = record?.date || today();
  fields.date.max = "9999-12-31";
  for (const name of ["work", "amount", "km", "shop", "note"]) {
    fields[name].value = record?.[name] ?? "";
  }
  byId("editor-title").textContent = record ? "정비 기록 수정" : "정비 기록 추가";
  byId("error").hidden = true;
  byId("existing-receipt").hidden = !record?.receipt;
  if (record?.receipt) {
    editorUrl = URL.createObjectURL(record.receipt);
    byId("editor-image").src = editorUrl;
  }
  editor.showModal();
}

async function photoBlob(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1, 1600 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const context = canvas.getContext("2d", { alpha: false });
    context.fillStyle = "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", .83));
    if (!blob) throw new Error("image encoding failed");
    return blob;
  } finally {
    URL.revokeObjectURL(url);
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  if (writing) return;
  const work = fields.work.value.trim();
  const error = byId("error");
  const showError = message => { error.textContent = message; error.hidden = false; };
  if (!work) {
    showError("정비 항목을 입력해 주세요.");
    fields.work.focus();
    return;
  }
  const file = fields.receipt.files[0];
  const record = {
    id: editedRecord?.id || (globalThis.crypto.randomUUID?.() ?? Date.now() + "-" + Math.random()),
    createdAt: editedRecord?.createdAt ?? Date.now(),
    date: fields.date.value,
    work,
    amount: fields.amount.valueAsNumber,
    km: fields.km.value === "" ? null : fields.km.valueAsNumber,
    shop: fields.shop.value.trim(),
    note: fields.note.value.trim(),
    receipt: removeReceipt ? null : editedRecord?.receipt || null
  };
  if (!/^\d{4}-\d{2}-\d{2}$/u.test(record.date)) {
    showError("정비 날짜를 확인해 주세요.");
    return;
  }
  error.hidden = true;
  writing = true;
  byId("save").disabled = true;
  try {
    if (file) {
      try { record.receipt = await photoBlob(file); }
      catch { showError("사진을 읽을 수 없습니다. JPG나 PNG 파일로 다시 첨부해 주세요."); return; }
    }
    await operate("readwrite", store => store.put(record));
    const message = editedRecord ? "정비 기록을 수정했습니다." : "정비 기록을 저장했습니다.";
    records = records.filter(item => item.id !== record.id);
    records.push(record);
    editor.close();
    search.value = "";
    render(record.date.slice(0, 4));
    showToast(message);
  } catch {
    showError("저장하지 못했습니다. 브라우저 저장공간을 확인한 뒤 다시 시도해 주세요.");
  } finally {
    writing = false;
    byId("save").disabled = false;
  }
});

byId("del").addEventListener("click", async () => {
  if (writing || !confirm("이 정비 기록과 첨부 영수증을 삭제할까요?")) return;
  const id = selectedRecord.id;
  writing = true;
  try {
    await operate("readwrite", store => store.delete(id));
    records = records.filter(record => record.id !== id);
    viewer.close();
    render();
    showToast("정비 기록을 삭제했습니다.");
  } catch {
    alert("삭제하지 못했습니다. 다시 시도해 주세요.");
  } finally {
    writing = false;
  }
});

byId("edit").addEventListener("click", () => {
  if (writing) return;
  const record = selectedRecord;
  viewer.close();
  openEditor(record);
});
byId("remove-receipt").addEventListener("click", () => {
  removeReceipt = true;
  byId("existing-receipt").hidden = true;
});
byId("add").addEventListener("click", () => openEditor());
year.addEventListener("change", () => render());
search.addEventListener("input", () => render());
document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => { if (!writing) button.closest("dialog").close(); });
});
for (const dialog of [editor, viewer]) {

.edit-photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.edit-photo-del{position:absolute;top:2px;right:2px;width:22px;height:22px;background:rgba(160,20,20,.88);border:none;border-radius:50%;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.add-more-photo-label{width:76px;height:76px;border:1.5px dashed var(--bdm);border-radius:var(--rs);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--tx3);font-size:11px;gap:3px;background:var(--sur2);display:inline-flex}
.add-more-photo-icon{font-size:22px}
.lightbox{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:200}
.lightbox.hidden{display:none}
.lb-topbar{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;flex-shrink:0}
.lb-back{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:14px;padding:8px 16px;border-radius:20px;cursor:pointer;font-family:inherit}
.lb-info{font-size:13px;color:rgba(255,255,255,.6)}
.lb-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
.lb-img-area{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
.lb-img-area img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb-memo-panel{background:rgba(255,255,255,.07);border-top:.5px solid rgba(255,255,255,.1);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));max-height:35vh;overflow-y:auto}
.lb-memo-hdr{font-size:10px;font-weight:600;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.lb-memo-body{font-size:14px;color:rgba(255,255,255,.85);line-height:1.65}
.lb-no-memo{font-size:13px;color:rgba(255,255,255,.35)}
.hidden{display:none!important}
#todo-section.hidden{display:none}
.tip-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.tip-modal-bg.hidden{display:none}
.tip-modal{background:var(--sur);border-radius:20px 20px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-height:88vh;overflow-y:auto;}
.tip-modal::-webkit-scrollbar{display:none}
.tip-crop-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tip-crop-emoji-big{font-size:30px}
.tip-modal-name{font-size:16px;font-weight:700}
.tip-modal-sub{font-size:12px;color:var(--tx3);margin-top:2px}
.tip-textarea{width:100%;border:.5px solid var(--bdm);border-radius:var(--rs);padding:12px;font-size:14px;color:var(--tx);background:var(--sur2);font-family:inherit;outline:none;resize:none;min-height:200px;line-height:1.7;margin-bottom:10px}
.tip-save-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:var(--rs);padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.tip-save-btn.flower{background:var(--flower)}
/* 꽃밭 전용 컬러 */
.flower-accent{color:var(--flower)!important}
.flower-bg{background:var(--fl)!important}
.flower-border{border-color:var(--flower)!important}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="topbar-title">🌙 달빛 농장</div>
    <div id="topbar-right">
      <div id="date-chip" onclick="openDatePicker()"></div>
      <button onclick="exportData()" style="height:34px;padding:0 12px;border-radius:17px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap">💾 저장</button>
      <button id="settings-btn" onclick="switchTab('settings')">⚙</button>
    </div>
  </div>

  <div id="scroll-area">
    <div id="todo-section" style="padding:14px 14px 0">
      <div class="todo-board">
        <div class="bh"><span class="bh-title">다음에 할 일</span><span class="bh-count" id="todo-counts"></span></div>
        <div class="todo-input-row">
          <input type="text" id="todo-input" placeholder="할 일 입력..." maxlength="60" onkeydown="if(event.key==='Enter')addTodo()">
          <button class="tadd" onclick="addTodo()">추가</button>
        </div>
        <div id="todo-pending"></div>
        <div id="todo-done-section"></div>
      </div>
    </div>

    <div class="pg active" id="tab-timeline" style="padding:0 14px 14px">
      <div class="pg-title">최근 기록</div>
      <div id="timeline-list"></div>
    </div>

    <div class="pg" id="tab-list" style="padding:0 14px 14px">
      <div class="pg-title">작물 키우기</div>
      <div class="sort-bar">
        <span>정렬:</span>
        <button class="sort-btn active" id="crop-sort-date-btn" onclick="setCropSort('date')">심은 날짜순</button>
        <button class="sort-btn" id="crop-sort-name-btn" onclick="setCropSort('name')">명칭순</button>
      </div>
      <div class="crop-grid" id="crop-grid"></div>
    </div>

    <div class="pg" id="tab-tree" style="padding:0 14px 14px">
      <div class="pg-title">나무 키우기</div>
      <div class="sort-bar">
        <span>정렬:</span>
        <button class="sort-btn active" id="sort-date-btn" onclick="setTreeSort('date')">심은 날짜순</button>
        <button class="sort-btn" id="sort-name-btn" onclick="setTreeSort('name')">명칭순</button>
      </div>
      <div class="crop-grid" id="tree-grid"></div>
    </div>

    <!-- 꽃밭 탭 -->
    <div class="pg" id="tab-flower" style="padding:0 14px 14px">
      <div class="pg-title" style="color:var(--flower)">🌸 꽃밭</div>
      <div class="sort-bar">
        <span>정렬:</span>
        <button class="sort-btn active" id="flower-sort-date-btn" onclick="setFlowerSort('date')">심은 날짜순</button>
        <button class="sort-btn" id="flower-sort-name-btn" onclick="setFlowerSort('name')">명칭순</button>
      </div>
      <div class="crop-grid" id="flower-grid"></div>
    </div>

    <div class="pg" id="tab-tree-detail" style="padding:14px">
      <div class="detail-panel">
        <div class="det-header">
          <span class="det-emoji" id="td-emoji"></span>
          <div class="det-title"><h2 id="td-name"></h2><p id="td-planted"></p></div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
            <button class="back-btn" onclick="showTreePrev()">← 뒤로</button>
            <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
              <button onclick="openEditTreeFromDetail()" style="background:var(--gl);color:var(--green);border:none;border-radius:var(--rs);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">✎ 수정</button>
              <button onclick="openTipModalForTree(currentTreeId)" style="background:var(--gl);color:var(--green);border:none;border-radius:var(--rs);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🌱 팁</button>
              <button onclick="deleteTree()" style="background:var(--rl);color:var(--red);border:none;border-radius:var(--rs);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🗑 삭제</button>
            </div>
          </div>
        </div>
        <div id="tree-tip-preview-area"></div>
        <div class="slabel">날짜별 사진 &amp;amp; 메모</div>
        <div class="entry-list" id="tree-entry-list"></div>
        <div class="add-entry-area">
          <div class="add-entry-toolbar">
            <span>새 기록 추가</span>
            <input type="date" id="tree-entry-date-sel" class="add-entry-date">
            <label class="photo-upload-label" for="tree-photo-input">📷 사진</label>
            <input type="file" id="tree-photo-input" accept="image/*" multiple class="hidden" onchange="treePreviewPhotos(event)">
          </div>
          <div id="tree-add-photos-col" class="preview-photos-strip"><div class="no-preview-placeholder">📷</div></div>
          <textarea class="add-entry-memo" id="tree-new-entry-memo" placeholder="이 날의 생육 상태를 메모하세요..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">&lt;/textarea>
          <button class="add-entry-save" onclick="saveTreeEntry()">기록 저장</button>
        </div>
      </div>
    </div>

    <!-- 꽃밭 상세 뷰 -->
    <div class="pg" id="tab-flower-detail" style="padding:14px">
      <div class="detail-panel">
        <div class="det-header">
          <span class="det-emoji" id="fd-emoji"></span>
          <div class="det-title"><h2 id="fd-name"></h2><p id="fd-planted"></p></div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
            <button class="back-btn" onclick="showFlowerPrev()">← 뒤로</button>
            <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
              <button onclick="openEditFlowerFromDetail()" style="background:var(--fl);color:var(--flower);border:none;border-radius:var(--rs);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">✎ 수정</button>
              <button onclick="openTipModalForFlower(currentFlowerId)" style="background:var(--fl);color:var(--flower);border:none;border-radius:var(--rs);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🌸 팁</button>
              <button onclick="deleteFlower()" style="background:var(--rl);color:var(--red);border:none;border-radius:var(--rs);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🗑 삭제</button>
            </div>
          </div>
        </div>
        <div id="flower-tip-preview-area"></div>
        <div class="slabel">날짜별 사진 &amp;amp; 메모</div>
        <div class="entry-list" id="flower-entry-list"></div>
        <div class="add-entry-area">
          <div class="add-entry-toolbar">
            <span>새 기록 추가</span>
            <input type="date" id="flower-entry-date-sel" class="add-entry-date">
            <label class="photo-upload-label flower" for="flower-photo-input">📷 사진</label>
            <input type="file" id="flower-photo-input" accept="image/*" multiple class="hidden" onchange="flowerPreviewPhotos(event)">
          </div>
          <div id="flower-add-photos-col" class="preview-photos-strip"><div class="no-preview-placeholder">🌸</div></div>
          <textarea class="add-entry-memo" id="flower-new-entry-memo" placeholder="이 날의 개화 상태를 메모하세요..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">&lt;/textarea>
          <button class="add-entry-save flower" onclick="saveFlowerEntry()">기록 저장</button>
        </div>
      </div>
    </div>

    <div class="pg" id="tab-yearly" style="padding:14px">
      <div class="pg-title">연도별 기록</div>
      <div id="yearly-content"></div>
    </div>

    <div class="pg" id="tab-board" style="padding:14px">
      <div class="pg-title">농장 기록</div>
      <div class="board-write-area">
        <div class="board-write-toolbar">
          <span>새 글 작성</span>
          <input type="date" id="board-date-sel" class="add-entry-date">
          <label class="photo-upload-label" for="board-photo-input">📷 사진</label>
          <input type="file" id="board-photo-input" accept="image/*" multiple class="hidden" onchange="boardPreviewPhotos(event)">
        </div>
        <div id="board-preview-strip" class="preview-photos-strip"><div class="no-preview-placeholder">📷</div></div>
        <input type="text" id="board-title-input" class="board-title-input" placeholder="제목을 입력하세요..." maxlength="50">
        <textarea class="board-body-input" id="board-body-input" placeholder="농장 일지, 메모, 관찰 기록 등을 자유롭게 작성하세요..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">&lt;/textarea>
        <button class="board-save-btn" onclick="saveBoardPost()">글 저장</button>
      </div>
      <div id="board-list"></div>
    </div>

    <div class="pg" id="tab-settings" style="padding:14px">
      <div class="pg-title">환경설정</div>
      <div id="version-badge" style="display:inline-block;background:var(--gl);color:var(--green);font-size:12px;font-weight:700;padding:5px 13px;border-radius:14px;margin-bottom:14px;letter-spacing:.03em"></div>
      <div class="settings-panel">
        <div class="ss-sec">
          <div class="ss-title">배경 색상</div>
          <div class="swatches" id="color-swatches"></div>
          <div class="cc-row">
            <input type="color" id="custom-bg-color" value="#f5f3ee" oninput="applyBg(this.value,'custom')">
            <span style="font-size:12px;color:var(--tx3)" id="custom-color-hex">#f5f3ee</span>
          </div>
          <button class="ss-btn" onclick="applyBg('','reset')">기본값으로</button>
        </div>
        <div class="ss-sec">
          <div class="ss-title">데이터 저장 / 불러오기</div>
          <button class="ss-btn" onclick="exportData()">📥 JSON 파일로 저장 (사진 포함)</button>
          <label class="ss-btn" style="cursor:pointer;margin-top:8px;display:block;text-align:center" for="import-file">📤 JSON 파일 불러오기</label>
          <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
          <div class="info-row">저장 파일에는 작물 데이터, 메모, 할 일, 사진(base64)이 모두 포함됩니다.</div>
        </div>
        <div class="ss-sec">
          <div class="ss-title">데이터 관리</div>
          <button class="ss-btn danger" onclick="resetAll()">⚠ 모든 데이터 초기화</button>
          <div class="info-row">초기화 시 작물, 나무, 꽃밭, 메모, 할 일이 모두 삭제됩니다.</div>
        </div>
        <div class="ss-sec">
          <div class="ss-title">앱 정보</div>
          <div class="info-row">달빛 농장 v8.3 — 작물·나무·꽃밭 기록, 사진·메모 연동, 할 일 관리, 연도별 수확 통계, 농장 기록 게시판, 작물별 키우기 팁</div>
        </div>
      </div>
    </div>

    <div class="pg" id="detail-view" style="padding:14px">
      <div class="detail-panel">
        <div class="det-header">
          <span class="det-emoji" id="d-emoji"></span>
          <div class="det-title"><h2 id="d-name"></h2><p id="d-planted"></p></div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
            <button class="back-btn" onclick="showPrev()">← 뒤로</button>
            <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
              <button onclick="openEditCropFromDetail()" style="background:var(--gl);color:var(--green);border:none;border-radius:var(--rs);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">✎ 수정</button>
              <button onclick="openTipModalForCrop(currentCropId)" style="background:var(--gl);color:var(--green);border:none;border-radius:var(--rs);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🌱 팁</button>
              <button onclick="deleteCrop()" style="background:var(--rl);color:var(--red);border:none;border-radius:var(--rs);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🗑 삭제</button>
            </div>
          </div>
        </div>
        <div id="crop-tip-preview-area"></div>
        <div class="slabel">날짜별 사진 &amp;amp; 메모</div>
        <div class="entry-list" id="entry-list"></div>
        <div class="add-entry-area">
          <div class="add-entry-toolbar">
            <span>새 기록 추가</span>
            <input type="date" id="entry-date-sel" class="add-entry-date">
            <label class="photo-upload-label" for="photo-input">📷 사진</label>
            <input type="file" id="photo-input" accept="image/*" multiple class="hidden" onchange="previewPhotos(event)">
          </div>
          <div id="add-photos-col" class="preview-photos-strip"><div class="no-preview-placeholder">📷</div></div>
          <textarea class="add-entry-memo" id="new-entry-memo" placeholder="이 날의 생육 상태를 메모하세요..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">&lt;/textarea>
          <button class="add-entry-save" onclick="saveEntry()">기록 저장</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tabbar">
    <button class="tb-btn active" id="nav-timeline" onclick="switchTab('timeline')"><span class="tb-icon">📋</span><span class="tb-label">최근기록</span></button>
    <button class="tb-btn" id="nav-list" onclick="switchTab('list')"><span class="tb-icon">🌿</span><span class="tb-label">작물키우기</span></button>
    <button class="tb-btn" id="nav-tree" onclick="switchTab('tree')"><span class="tb-icon">🌳</span><span class="tb-label">나무키우기</span></button>
    <button class="tb-btn" id="nav-flower" onclick="switchTab('flower')"><span class="tb-icon">🌸</span><span class="tb-label">꽃밭</span></button>
    <button class="tb-btn" id="nav-yearly" onclick="switchTab('yearly')"><span class="tb-icon">📅</span><span class="tb-label">연도별</span></button>
    <button class="tb-btn" id="nav-board" onclick="switchTab('board')"><span class="tb-icon">📝</span><span class="tb-label">농장기록</span></button>
  </div>
</div>

<!-- 날짜 선택 모달 -->
<div class="modal-bg hidden" id="date-pick-modal">
  <div class="modal"><div class="modal-handle"></div><h3>날짜 선택</h3>
    <input type="date" id="global-date-input">
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal('date-pick-modal')">취소</button><button class="btn-ok" onclick="applyGlobalDate()">적용</button></div>
  </div>
</div>

<!-- 작물 추가 모달 -->
<div class="modal-bg hidden" id="add-modal">
  <div class="modal"><div class="modal-handle"></div><h3>새 작물 추가</h3>
    <select id="modal-emoji">
      <option value="🍆|가지">🍆 가지</option>
      <option value="🥔|감자">🥔 감자</option>
      <option value="🍠|고구마">🍠 고구마</option>
      <option value="🌶️|고추">🌶️ 고추</option>
      <option value="🌿|당귀">🌿 당귀</option>
      <option value="🥕|당근">🥕 당근</option>
      <option value="🌿|대파">🌿 대파</option>
      <option value="🧄|마늘">🧄 마늘</option>
      <option value="🍃|머위">🍃 머위</option>
      <option value="🌱|부추">🌱 부추</option>
      <option value="🥬|상추">🥬 상추</option>
      <option value="🍉|수박">🍉 수박</option>
      <option value="🌱|아스파라거스">🌱 아스파라거스</option>
      <option value="🧅|양파">🧅 양파</option>
      <option value="🥒|오이">🥒 오이</option>
      <option value="🌽|옥수수">🌽 옥수수</option>
      <option value="🪴|쪽파">🪴 쪽파</option>
      <option value="🍈|참외">🍈 참외</option>
      <option value="🍅|토마토">🍅 토마토</option>
      <option value="🎃|호박">🎃 호박</option>
      <option value="🌾|기타">🌾 기타</option>
    </select>
    <input type="text" id="modal-name" placeholder="작물 이름 (예: 방울토마토)" maxlength="15">
    <div class="mlabel">심은 날짜</div><input type="date" id="modal-date">
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal('add-modal')">취소</button><button class="btn-ok" onclick="addCrop()">추가</button></div>
  </div>
</div>

<!-- 작물 수정 모달 -->
<div class="modal-bg hidden" id="edit-crop-modal">
  <div class="modal"><div class="modal-handle"></div><h3>작물 정보 수정</h3>
    <select id="edit-crop-emoji">
      <option value="🍆|가지">🍆 가지</option>
      <option value="🥔|감자">🥔 감자</option>
      <option value="🍠|고구마">🍠 고구마</option>
      <option value="🌶️|고추">🌶️ 고추</option>
      <option value="🌿|당귀">🌿 당귀</option>
      <option value="🥕|당근">🥕 당근</option>
      <option value="🌿|대파">🌿 대파</option>

function fmtDate(d){if(!d)return'';const[y,m,day]=d.split('-');return`${y}.${m}.${day}`}
function fmtShort(d){if(!d)return'';const[y,m,day]=d.split('-');return`${String(y).slice(2)}.${m}.${day}`}
function daysSince(d){
  if(!d)return'';
  const start=new Date(d);const now=new Date();
  let years=now.getFullYear()-start.getFullYear();
  let months=now.getMonth()-start.getMonth();
  if(months<0){years--;months+=12;}
  const totalDays=Math.floor((now-start)/86400000);
  if(totalDays<365){return`심은 지 ${totalDays}일`;}
  if(years>0&amp;&amp;months>0)return`심은 지 ${years}년 ${months}개월`;
  if(years>0)return`심은 지 ${years}년`;
  return`심은 지 ${months}개월`;
}
function daysSinceTree(d){
  if(!d)return'';const start=new Date(d);const now=new Date();
  let years=now.getFullYear()-start.getFullYear();let months=now.getMonth()-start.getMonth();
  if(months<0){years--;months+=12;}
  if(years>0&amp;&amp;months>0)return`심은 지 ${years}년 ${months}개월`;
  if(years>0)return`심은 지 ${years}년`;
  if(months>0)return`심은 지 ${months}개월`;
  return`심은 지 ${Math.floor((now-start)/86400000)}일`;
}
function getYear(d){return d?d.slice(0,4):''}

// ════ 할 일 ════
function todoItemHtml(t){
  const dateTag=t.addedDate?`<span class="tdateTag">(${fmtShort(t.addedDate)})</span>`:'';
  if(t.done){
    return`<div class="titem" id="titem-${t.id}"><div class="tcb done" onclick="toggleTodo(${t.id})"></div><span class="ttxt done">${t.text} ${dateTag}</span><button class="tdel" onclick="deleteTodo(${t.id})">✕</button></div>`;
  }
  return`<div class="titem" id="titem-${t.id}"><div class="tcb" onclick="toggleTodo(${t.id})"></div><span class="ttxt">${t.text} ${dateTag}</span><button style="background:none;border:none;color:var(--tx3);font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0" onclick="startEditTodo(${t.id})" title="수정">✎</button><button class="tdel" onclick="deleteTodo(${t.id})">✕</button></div>`;
}
function startEditTodo(id){
  const t=todos.find(t=>t.id===id);if(!t)return;
  const el=document.getElementById('titem-'+id);if(!el)return;
  el.innerHTML=`<input class="tedit-input" id="tedit-${id}" value="${t.text.replace(/&amp;/g,'&amp;amp;').replace(/"/g,'&amp;quot;')}" maxlength="60" onkeydown="if(event.key==='Enter')commitEditTodo(${id});if(event.key==='Escape')renderTodos()">
    <button class="tedit-save" onclick="commitEditTodo(${id})">저장</button>
    <button class="tedit-cancel" onclick="renderTodos()">취소</button>`;
  const inp=document.getElementById('tedit-'+id);if(inp){inp.focus();inp.select();}
}
function commitEditTodo(id){
  const inp=document.getElementById('tedit-'+id);if(!inp)return;
  const val=inp.value.trim();if(!val)return;
  const t=todos.find(t=>t.id===id);if(t){t.text=val;saveTodos();}
  renderTodos();
}
function renderTodos(){
  const pending=todos.filter(t=>!t.done),done=todos.filter(t=>t.done);
  document.getElementById('todo-counts').textContent=`남은 할 일 ${pending.length}개`;
  const pEl=document.getElementById('todo-pending');
  const sp=showAllPending?pending:pending.slice(0,MAX);
  let ph=sp.length===0?'<div class="no-todo">앞으로 할 일이 없어요.</div>':sp.map(todoItemHtml).join('');
  if(pending.length>MAX){const n=pending.length-MAX;ph+=`<button class="more-btn" onclick="showAllPending=!showAllPending;renderTodos()">${showAllPending?'▲ 접기':'▼ 더보기 ('+n+'개)'}</button>`;}
  pEl.innerHTML=ph;
  const dEl=document.getElementById('todo-done-section');
  if(!done.length){dEl.innerHTML='';return;}
  const sd=showAllDone?done:done.slice(0,MAX);
  let dh=`<div class="tsec">완료됨 (${done.length})</div>`+sd.map(todoItemHtml).join('');
  if(done.length>MAX){const n=done.length-MAX;dh+=`<button class="more-btn" onclick="showAllDone=!showAllDone;renderTodos()">${showAllDone?'▲ 접기':'▼ 더보기 ('+n+'개)'}</button>`;}
  dEl.innerHTML=dh;
}
function addTodo(){const v=document.getElementById('todo-input').value.trim();if(!v)return;const id=todos.length>0?Math.max(...todos.map(t=>t.id))+1:1;todos.unshift({id,text:v,done:false,addedDate:globalDate});saveTodos();document.getElementById('todo-input').value='';renderTodos();}
function toggleTodo(id){const t=todos.find(t=>t.id===id);if(t){t.done=!t.done;saveTodos();renderTodos()}}
function deleteTodo(id){todos=todos.filter(t=>t.id!==id);saveTodos();renderTodos()}

let currentTipKey=null;
let currentTipType=null; // 'crop','tree','flower'
function openTipModalForCrop(cropId){

  document.getElementById('tip-save-btn').className='tip-save-btn flower';
  document.getElementById('tip-modal').classList.remove('hidden');
}
function closeTipModal(){document.getElementById('tip-modal').classList.add('hidden');currentTipKey=null;currentTipType=null;}
function saveTip(){
  if(!currentTipKey)return;
  const val=document.getElementById('tip-modal-textarea').value.trim();
  if(currentTipType==='tree'){
    if(val)treeTips[currentTipKey]=val; else delete treeTips[currentTipKey];
    saveTreeTips();closeTipModal();
    if(currentTreeId){const t=trees.find(t=>t.id===currentTreeId);if(t)renderTreeTipPreview(t);}
    renderTreeList();
  } else if(currentTipType==='flower'){
    if(val)flowerTips[currentTipKey]=val; else delete flowerTips[currentTipKey];
    saveFlowerTips();closeTipModal();
    if(currentFlowerId){const f=flowers.find(f=>f.id===currentFlowerId);if(f)renderFlowerTipPreview(f);}
    renderFlowerList();
  } else {
    if(val)cropTips[currentTipKey]=val; else delete cropTips[currentTipKey];
    saveCropTips();closeTipModal();
    if(currentCropId){const c=crops.find(c=>c.id===currentCropId);if(c)renderCropTipPreview(c);}
    renderList();
  }
}
function renderCropTipPreview(c){
  const area=document.getElementById('crop-tip-preview-area');if(!area)return;
  const kindName=c.kind||emojiLabel(c.emoji)||c.name;
  const tip=cropTips[kindName];
  if(!tip){area.innerHTML='';return;}
  area.innerHTML=`<div class="tip-preview-box"><div style="font-size:11px;font-weight:700;color:var(--green);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">🌱 ${kindName} 키우기 팁</div><div style="font-size:13px;color:var(--tx2);white-space:pre-wrap">${tip.replace(/</g,'&amp;lt;')}</div><button onclick="openTipModalForCrop(${c.id})" style="background:none;border:none;font-size:12px;color:var(--green);cursor:pointer;font-family:inherit;margin-top:8px;font-weight:600;padding:0">✎ 팁 수정하기</button></div>`;
}
function renderTreeTipPreview(t){
  const area=document.getElementById('tree-tip-preview-area');if(!area)return;
  const kindName=t.kind||treeEmojiLabel(t.emoji)||t.name;

  const tip=flowerTips[kindName];

  area.innerHTML=`<div class="tip-preview-box flower"><div style="font-size:11px;font-weight:700;color:var(--flower);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">🌸 ${kindName} 키우기 팁</div><div style="font-size:13px;color:var(--tx2);white-space:pre-wrap">${tip.replace(/</g,'&amp;lt;')}</div><button onclick="openTipModalForFlower(${f.id})" style="background:none;border:none;font-size:12px;color:var(--flower);cursor:pointer;font-family:inherit;margin-top:8px;font-weight:600;padding:0">✎ 팁 수정하기</button></div>`;
}

// 이모지 → 이름 매핑
const EMOJI_NAME={};
[['🍆','가지'],['🥔','감자'],['🍠','고구마'],['🌶️','고추'],['🌿','당귀'],['🥕','당근'],
 ['🌿','대파'],['🧄','마늘'],['🍃','머위'],['🌱','부추'],['🥬','상추'],['🍉','수박'],
 ['🌱','아스파라거스'],['🧅','양파'],['🥒','오이'],['🌽','옥수수'],['🪴','쪽파'],
 ['🍈','참외'],['🍅','토마토'],['🎃','호박'],['🌾','기타']
].forEach(([e,n])=>EMOJI_NAME[e+'|'+n]=n);
function emojiLabel(val){if(EMOJI_NAME[val])return EMOJI_NAME[val];const k=Object.keys(EMOJI_NAME).find(k=>k.startsWith(val+'|'));return k?EMOJI_NAME[k]:val;}

const FLOWER_EMOJI_NAME={};
[['🌼','개나리'],['🌸','국화'],['🌻','금계국'],['🌸','만리향'],['🌾','백일홍'],
 ['🪷','백합'],['🌸','원추리꽃'],['🌸','천리향'],['🌺','코스모스'],['🌷','튤립'],
 ['🌻','해바라기'],['💜','히아신스'],['🪷','작약'],['🌸','기타']
].forEach(([e,n])=>FLOWER_EMOJI_NAME[e+'|'+n]=n);
function flowerEmojiLabel(val){if(FLOWER_EMOJI_NAME[val])return FLOWER_EMOJI_NAME[val];const k=Object.keys(FLOWER_EMOJI_NAME).find(k=>k.startsWith(val+'|'));return k?FLOWER_EMOJI_NAME[k]:val;}

// ════ 작물 목록 ════
function renderList(){
  const grid=document.getElementById('crop-grid');grid.innerHTML='';
  let sorted=[...crops];
  if(cropSortMode==='date'){
    sorted.sort((a,b)=>b.planted.localeCompare(a.planted));
  } else {
    sorted.sort((a,b)=>{
      const ka=a.kind||emojiLabel(a.emoji)||a.name;
      const kb=b.kind||emojiLabel(b.emoji)||b.name;
      return ka.localeCompare(kb,'ko');
    });
  }
  sorted.forEach(c=>{
    const kindName=c.kind||emojiLabel(c.emoji)||c.name;
    const hasTip=!!cropTips[kindName];
    const allPhotos=(c.entries||[]).flatMap(e=>e.photos||[]);
    const imgH=allPhotos.length>0
      ?`<div style="position:relative;width:100%;height:100%"><img src="${allPhotos[allPhotos.length-1]}" alt="" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:5px 6px 7px;text-align:center"><div style="font-size:12px;font-weight:700;color:#fff">${c.emoji} ${kindName}</div><div style="font-size:10px;color:rgba(255,255,255,.8);margin-top:1px">${c.name}</div></div></div>`
      :`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px"><span style="font-size:36px">${c.emoji}</span><span style="font-size:12px;font-weight:700;color:var(--tx);text-align:center">${kindName}</span><span style="font-size:10px;color:var(--tx3);text-align:center">${c.name}</span></div>`;
    const card=document.createElement('div');
    card.className='crop-card'+(c.harvested?' harvested':'');
    card.innerHTML=`${c.harvested?'<span class="hvbadge">수확 완료</span>':''}
      <div class="crop-img" onclick="showDetail(${c.id})">${imgH}</div>
      <div class="crop-info">
        <div class="crop-row"><div class="hvcb${c.harvested?' done':''}" onclick="toggleHarvest(event,${c.id})"></div><span class="cname" onclick="showDetail(${c.id})">${c.emoji} ${kindName}</span></div>
        <div style="font-size:11px;color:var(--tx3);margin-top:1px;padding-left:25px;font-style:italic">${c.name}</div>
        <div class="csub" style="margin-top:3px">${c.harvested?fmtDate(c.harvestDate)+' 수확':daysSince(c.planted)}</div>
        ${c.yieldNote?`<div class="cyield">수확량: ${c.yieldNote}</div>`:''}
        <div style="padding-top:5px;padding-left:25px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button onclick="openEditCrop(event,${c.id})" style="background:none;border:none;font-size:11px;color:var(--tx3);cursor:pointer;font-family:inherit;padding:0">✎ 정보 수정</button>
          <button onclick="event.stopPropagation();openTipModalForCrop(${c.id})" class="tip-btn${hasTip?' has-tip':''}">🌱 팁${hasTip?' ✓':''}</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
  const ab=document.createElement('div');ab.className='add-crop-btn';
  ab.onclick=()=>{document.getElementById('modal-date').value=globalDate;document.getElementById('add-modal').classList.remove('hidden')};
  ab.innerHTML='<div class="add-icon">+</div><span>작물 추가</span>';
  grid.appendChild(ab);
}

function toggleHarvest(e,id){
  e.stopPropagation();const c=crops.find(c=>c.id===id);if(!c)return;
  if(!c.harvested){
    harvestPendingId=id;document.getElementById('harvest-info').textContent=`${c.emoji} ${c.name}의 최종 수확 정보를 기록해주세요.`;
    document.getElementById('harvest-yield').value=c.yieldNote||'';document.getElementById('harvest-date').value=globalDate;
    document.getElementById('harvest-modal').classList.remove('hidden');
  } else {c.harvested=false;c.harvestDate='';c.yieldNote='';save();renderList()}
}
function cancelHarvest(){harvestPendingId=null;document.getElementById('harvest-modal').classList.add('hidden')}
function confirmHarvest(){
  const c=crops.find(c=>c.id===harvestPendingId);if(!c)return;
  c.harvested=true;c.harvestDate=document.getElementById('harvest-date').value||globalDate;
  c.yieldNote=document.getElementById('harvest-yield').value.trim();
  save();document.getElementById('harvest-modal').classList.add('hidden');harvestPendingId=null;renderList();
}

function showDetail(id){
  currentCropId=id;const c=crops.find(c=>c.id===id);
  document.getElementById('d-emoji').textContent=c.emoji;document.getElementById('d-name').textContent=c.name;
  document.getElementById('d-planted').textContent=`심은 날: ${fmtDate(c.planted)} · ${daysSince(c.planted)}`;
  document.getElementById('entry-date-sel').value=globalDate;
  resetNewEntryForm();renderCropTipPreview(c);renderEntries(c);
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('active'));

  document.getElementById('todo-section').classList.add('hidden');
  document.getElementById('scroll-area').scrollTop=0;
  document.getElementById('topbar-title').innerHTML=`<button onclick="showPrev()" style="background:none;border:none;font-size:15px;color:var(--green);font-family:inherit;font-weight:600;padding:0;cursor:pointer">← 뒤로</button>`;
}
function showPrev(){document.getElementById('detail-view').classList.remove('active');document.getElementById('topbar-title').textContent='🌙 달빛 농장';switchTab(prevTab);}

function renderEntries(c){
  const list=document.getElementById('entry-list');
  const sorted=[...(c.entries||[])].sort((a,b)=>b.date.localeCompare(a.date));
  if(!sorted.length){list.innerHTML='<div style="font-size:13px;color:var(--tx3);padding:4px 0 10px">아직 기록이 없어요.</div>';return;}
  list.innerHTML=sorted.map(entry=>{
    const oi=c.entries.findIndex(e=>e.date===entry.date);
    const photos=entry.photos||[];
    const strip=photos.length?'<div class="entry-photos-col">'+photos.map((ph,pi)=>`<div class="ephoto-wrap"><img src="${ph}" alt="" onclick="openLightboxDetail(${oi},${pi})"><button class="ephoto-del" onclick="deleteEntryPhoto(${oi},${pi})">✕</button></div>`).join('')+'</div>':'<div class="no-photo-strip">사진 없음</div>';
    const memoH=entry.memo?entry.memo.replace(/</g,'&amp;lt;').replace(/\n/g,'<br>'):'';
    return`<div class="entry-slot"><div class="entry-slot-header"><span class="edate">${fmtDate(entry.date)}<span class="ecount">사진 ${photos.length}장</span></span><button class="edelete-all" onclick="deleteEntry(${oi})">삭제</button></div>${strip}<div class="entry-memo-col">${memoH?`<div class="ememo-text">${memoH}</div>`:'<div class="ememo-empty">메모 없음</div>'}<button class="entry-edit-btn" onclick="openEditEntry(${oi})">✎ 날짜·사진·메모 수정</button></div></div>`;
  }).join('');
}
function deleteEntryPhoto(oi,pi){showConfirm('사진 삭제','이 사진을 삭제할까요?',()=>{const c=crops.find(c=>c.id===currentCropId);c.entries[oi].photos.splice(pi,1);save();renderEntries(c);});}
function deleteEntry(idx){showConfirm('기록 삭제','이 날의 사진과 메모를 모두 삭제할까요?',()=>{const c=crops.find(c=>c.id===currentCropId);c.entries.splice(idx,1);save();renderEntries(c);});}
function openLightboxDetail(oi,pi){const c=crops.find(c=>c.id===currentCropId);const e=c.entries[oi];openLightboxDirect(e.photos[pi],e.date,e.memo,pi,e.photos.length);}
function openLightboxDirect(src,date,memo,idx,total){
  document.getElementById('lb-img').src=src;
  document.getElementById('lb-date-info').textContent=`${fmtDate(date)} (${idx+1}/${total}장)`;

}
function closeLightbox(){document.getElementById('lightbox').classList.add('hidden')}

function previewPhotos(e){const files=Array.from(e.target.files);if(!files.length)return;let n=0;files.forEach(f=>{const r=new FileReader();r.onload=ev=>{pendingPhotos.push(ev.target.result);n++;if(n===files.length)renderPreviewArea();};r.readAsDataURL(f);});e.target.value='';}
function renderPreviewArea(){const a=document.getElementById('add-photos-col');if(!pendingPhotos.length){a.innerHTML='<div class="no-preview-placeholder">📷</div>';return;}a.innerHTML=pendingPhotos.map((ph,i)=>`<div class="preview-wrap"><img src="${ph}" alt=""><button class="preview-del" onclick="removePendingPhoto(${i})">✕</button></div>`).join('');}
function removePendingPhoto(i){pendingPhotos.splice(i,1);renderPreviewArea()}
function resetNewEntryForm(){pendingPhotos=[];renderPreviewArea();document.getElementById('new-entry-memo').value=''}
function saveEntry(){
  const date=document.getElementById('entry-date-sel').value||globalDate;const memo=document.getElementById('new-entry-memo').value.trim();
  if(!pendingPhotos.length&amp;&amp;!memo){showConfirm('입력 필요','사진이나 메모 중 하나 이상 입력해주세요.',()=>{},'확인','var(--green)');return;}
  const c=crops.find(c=>c.id===currentCropId);const ei=c.entries.findIndex(e=>e.date===date);
  if(ei>=0){showConfirm('기록 추가',`${fmtDate(date)}에 이미 기록이 있습니다. 추가할까요?`,()=>{c.entries[ei].photos.push(...pendingPhotos);if(memo)c.entries[ei].memo=memo;save();resetNewEntryForm();renderEntries(c);document.getElementById('scroll-area').scrollTop=0;},'추가','var(--green)');}
  else{c.entries.push({date,photos:[...pendingPhotos],memo});save();resetNewEntryForm();renderEntries(c);document.getElementById('scroll-area').scrollTop=0;}
}
function openEditEntry(idx){
  const c=crops.find(c=>c.id===currentCropId);const e=c.entries[idx];
  editingEntryDate=e.date;editingEntryIdx=idx;
  document.getElementById('edit-modal-title').textContent='기록 수정';
  document.getElementById('edit-entry-date-input').value=e.date;
  renderEditPhotosGrid(e.photos||[]);document.getElementById('edit-modal-memo').value=e.memo||'';
  document.getElementById('edit-entry-modal').classList.remove('hidden');
}
function renderEditPhotosGrid(photos){document.getElementById('edit-photos-grid').innerHTML=photos.map((ph,i)=>`<div class="edit-photo-thumb"><img src="${ph}" alt=""><button class="edit-photo-del" onclick="editDeletePhoto(${i})">✕</button></div>`).join('');}
function editDeletePhoto(pi){const c=crops.find(c=>c.id===currentCropId);const e=c.entries.find(e=>e.date===editingEntryDate);if(!e)return;e.photos.splice(pi,1);save();renderEditPhotosGrid(e.photos);}
function editAddPhotos(ev){const files=Array.from(ev.target.files);if(!files.length)return;let n=0;const c=crops.find(c=>c.id===currentCropId);const e=c.entries.find(e=>e.date===editingEntryDate);files.forEach(f=>{const r=new FileReader();r.onload=x=>{if(e)e.photos.push(x.target.result);n++;if(n===files.length){save();renderEditPhotosGrid(e?e.photos:[]);}};r.readAsDataURL(f);});ev.target.value='';}
function saveEditEntry(){
  const c=crops.find(c=>c.id===currentCropId);const e=c.entries.find(e=>e.date===editingEntryDate);if(!e)return;
  const newDate=document.getElementById('edit-entry-date-input').value;
  if(newDate&amp;&amp;newDate!==editingEntryDate){const conflict=c.entries.find(en=>en.date===newDate);if(conflict){showConfirm('날짜 중복',`${fmtDate(newDate)}에 이미 기록이 있어요.`,()=>{},'확인','var(--amber)');return;}e.date=newDate;editingEntryDate=newDate;}
  e.memo=document.getElementById('edit-modal-memo').value.trim();
  save();closeModal('edit-entry-modal');renderEntries(c);
}

// ════ 타임라인 ════
function renderTimeline(){
  const all=[];
  crops.forEach(c=>{
    (c.entries||[]).forEach(e=>{if((e.photos&amp;&amp;e.photos.length)||e.memo)all.push({date:e.date,type:'entry',cropName:c.name,cropEmoji:c.emoji,photos:e.photos||[],memo:e.memo,cropId:c.id});});
    if(c.harvested&amp;&amp;c.harvestDate)all.push({date:c.harvestDate,type:'harvest',cropName:c.name,cropEmoji:c.emoji,yieldNote:c.yieldNote});
  });
  trees.forEach(t=>{(t.entries||[]).forEach(e=>{if((e.photos&amp;&amp;e.photos.length)||e.memo)all.push({date:e.date,type:'tree-entry',cropName:t.name,cropEmoji:t.emoji,photos:e.photos||[],memo:e.memo,cropId:t.id});});});
  flowers.forEach(f=>{(f.entries||[]).forEach(e=>{if((e.photos&amp;&amp;e.photos.length)||e.memo)all.push({date:e.date,type:'flower-entry',cropName:f.name,cropEmoji:f.emoji,photos:e.photos||[],memo:e.memo,cropId:f.id});});});
  all.sort((a,b)=>b.date.localeCompare(a.date));
  const cont=document.getElementById('timeline-list');
  if(!all.length){cont.innerHTML='<div style="text-align:center;padding:3rem;color:var(--tx3)">아직 기록이 없어요.</div>';return;}
  cont.innerHTML=all.slice(0,60).map(item=>{
    if(item.type==='entry'||item.type==='tree-entry'||item.type==='flower-entry'){
      const photoStrip=item.photos.map((ph,pi)=>`<img src="${ph}" style="width:80px;height:64px;object-fit:cover;border-radius:6px;cursor:pointer;flex-shrink:0" onclick="openLightbox(${item.cropId},'${item.date}',${pi},'${item.type}')" alt="">`).join('');
      return`<div class="tl-item"><div class="tl-top"><span class="tl-who">${item.cropEmoji} ${item.cropName}</span><span class="tl-date">${fmtDate(item.date)}</span></div>${photoStrip?`<div class="tl-photos">${photoStrip}</div>`:''}${item.memo?`<div style="font-size:14px;color:var(--tx);line-height:1.6;margin-top:4px">${item.memo.replace(/</g,'&amp;lt;').replace(/\n/g,'<br>')}</div>`:''}</div>`;
    }
    return`<div class="tl-item"><div class="tl-top"><span class="tl-who">${item.cropEmoji} ${item.cropName} — 수확 완료</span><span class="tl-date">${fmtDate(item.date)}</span></div><div style="margin-top:6px"><span class="yield-tag">${item.yieldNote||'수확 완료'}</span></div></div>`;
  }).join('');
}
function openLightbox(cropId,date,photoIdx,type='entry'){
  let entry;
  if(type==='tree-entry'){const t=trees.find(t=>t.entries&amp;&amp;t.entries.some(e=>e.date===date));entry=t?(t.entries||[]).find(e=>e.date===date):null;}
  else if(type==='flower-entry'){const f=flowers.find(f=>f.entries&amp;&amp;f.entries.some(e=>e.date===date));entry=f?(f.entries||[]).find(e=>e.date===date):null;}
  else{const crop=crops.find(c=>c.id===cropId)||{entries:[]};entry=(crop.entries||[]).find(e=>e.date===date);}
  if(!entry||(entry.photos||[]).length===0)return;
  openLightboxDirect(entry.photos[photoIdx||0],date,entry.memo,photoIdx||0,entry.photos.length);
}

// ════ 연도별 ════
function renderYearly(){
  const cont=document.getElementById('yearly-content');
  const years=[...new Set(crops.map(c=>c.harvested&amp;&amp;c.harvestDate?getYear(c.harvestDate):getYear(c.planted)))].filter(Boolean).sort((a,b)=>b-a);
  if(!years.length){cont.innerHTML='<div style="font-size:13px;color:var(--tx3);text-align:center;padding:1rem">아직 기록된 작물이 없어요.</div>';return;}
  cont.innerHTML=years.map(year=>{
    const yc=crops.filter(c=>c.harvested&amp;&amp;c.harvestDate?getYear(c.harvestDate)===year:getYear(c.planted)===year);const hc=yc.filter(c=>c.harvested);
    const rows=yc.map(c=>`<div class="ycrow"><span class="ycem">${c.emoji}</span><div class="ycinfo"><div class="ycname">${c.name}</div><div class="ycdates">심은 날: ${fmtDate(c.planted)}${c.harvested&amp;&amp;c.harvestDate?' · 수확: '+fmtDate(c.harvestDate):''}</div></div><div class="ycright">${c.harvested?`<span class="yield-tag">${c.yieldNote||'수확 완료'}</span>`:'<span class="growing-tag">재배중</span>'}</div></div>`).join('');
    return`<div class="year-block"><div class="year-header" onclick="this.nextElementSibling.classList.toggle('hidden')"><span class="year-title">${year}년</span><span class="year-sum">작물 ${yc.length}종 · 수확 ${hc.length}종</span></div><div class="year-body"><div class="year-stats"><div class="ystat"><div class="ystat-num">${yc.length}</div><div class="ystat-lbl">심은 작물</div></div><div class="ystat"><div class="ystat-num" style="color:var(--green)">${hc.length}</div><div class="ystat-lbl">수확 완료</div></div><div class="ystat"><div class="ystat-num" style="color:var(--amber)">${yc.length-hc.length}</div><div class="ystat-lbl">재배중</div></div></div>${rows}</div></div>`;
  }).join('');
}

// ════ 농장 기록 게시판 ════
function boardPreviewPhotos(e){const files=Array.from(e.target.files);if(!files.length)return;let n=0;files.forEach(f=>{const r=new FileReader();r.onload=ev=>{boardPendingPhotos.push(ev.target.result);n++;if(n===files.length)renderBoardPreview();};r.readAsDataURL(f);});e.target.value='';}
function renderBoardPreview(){const a=document.getElementById('board-preview-strip');if(!boardPendingPhotos.length){a.innerHTML='<div class="no-preview-placeholder">📷</div>';return;}a.innerHTML=boardPendingPhotos.map((ph,i)=>`<div class="preview-wrap"><img src="${ph}" alt=""><button class="preview-del" onclick="removeBoardPhoto(${i})">✕</button></div>`).join('');}
function removeBoardPhoto(i){boardPendingPhotos.splice(i,1);renderBoardPreview()}
function saveBoardPost(){
  const title=document.getElementById('board-title-input').value.trim();
  const body=document.getElementById('board-body-input').value.trim();
  const date=document.getElementById('board-date-sel').value||globalDate;
  if(!title&amp;&amp;!body){showConfirm('입력 필요','제목이나 내용을 입력해주세요.',()=>{},'확인','var(--green)');return;}
  const id=boardPosts.length>0?Math.max(...boardPosts.map(p=>p.id))+1:1;

function deleteBoardPost(id){showConfirm('글 삭제','이 게시글을 삭제할까요?',()=>{boardPosts=boardPosts.filter(p=>p.id!==id);saveBoard();renderBoard();});}
function togglePostBody(id){const el=document.getElementById('post-body-'+id);if(el)el.classList.toggle('open');}
function openEditPost(id){
  const p=boardPosts.find(p=>p.id===id);if(!p)return;
  editingPostId=id;
  document.getElementById('edit-post-date').value=p.date||globalDate;
  document.getElementById('edit-post-title').value=p.title||'';
  document.getElementById('edit-post-body').value=p.body||'';

}
function renderEditPostPhotos(photos){document.getElementById('edit-post-photos-grid').innerHTML=photos.map((ph,i)=>`<div class="edit-photo-thumb"><img src="${ph}" alt=""><button class="edit-photo-del" onclick="editPostDeletePhoto(${i})">✕</button></div>`).join('');}
function editPostDeletePhoto(pi){const p=boardPosts.find(p=>p.id===editingPostId);if(!p)return;if(!p.photos)p.photos=[];p.photos.splice(pi,1);saveBoard();renderEditPostPhotos(p.photos);}
function editPostAddPhotos(ev){const files=Array.from(ev.target.files);if(!files.length)return;const p=boardPosts.find(p=>p.id===editingPostId);if(!p)return;if(!p.photos)p.photos=[];let n=0;files.forEach(f=>{const r=new FileReader();r.onload=x=>{p.photos.push(x.target.result);n++;if(n===files.length){saveBoard();renderEditPostPhotos(p.photos);}};r.readAsDataURL(f);});ev.target.value='';}
function saveEditPost(){
  const p=boardPosts.find(p=>p.id===editingPostId);if(!p)return;
  p.date=document.getElementById('edit-post-date').value||p.date;
  p.title=document.getElementById('edit-post-title').value.trim()||'(제목 없음)';

function renderBoard(){
  const cont=document.getElementById('board-list');
  if(!boardPosts.length){cont.innerHTML='<div class="no-post">아직 작성된 글이 없어요.<br>농장 일지를 기록해보세요! 🌱</div>';return;}
  const sorted=[...boardPosts].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
