(function migrateSavedThemes(){
  let changed = false;
  DEFAULT_THEMES.forEach(def => {
    const saved = themes.find(t => t.id === def.id);
    if (!saved) return;
    if (JSON.stringify(saved.fields) !== JSON.stringify(def.fields)) { saved.fields = def.fields; changed = true; }
    if (JSON.stringify(saved.statusOptions) !== JSON.stringify(def.statusOptions)) { saved.statusOptions = def.statusOptions; changed = true; }
    if (saved.defaultStatus !== def.defaultStatus) { saved.defaultStatus = def.defaultStatus; changed = true; }
  });
  if (changed) localStorage.setItem("jaks_themes", JSON.stringify(themes));
})();

function saveViewState() {

}
function restoreViewState() {
  try {
    const s = JSON.parse(localStorage.getItem("jaks_viewstate") || "{}");
    if (s.view) view = s.view;
    if (s.activeTheme && themes.find(t => t.id === s.activeTheme)) {

function showToast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2400);}

function scheduleMidnightSave(){
  const now=new Date(),midnight=new Date(now);midnight.setHours(24,0,0,0);
  const ms=midnight-now;
  setTimeout(()=>{
    const backup={savedAt:new Date().toISOString(),themes,memos,stickyNotes,regionOrders};
    localStorage.setItem("jaks_backup",JSON.stringify(backup));
    showToast("🌙 자정 자동저장 완료");
    scheduleMidnightSave();
  },ms);
}

function saveData(){
  try{
    const data={version:APP_VER,savedAt:new Date().toISOString(),themes,memos,stickyNotes,regionOrders};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=`jaks메모_${TODAY}.json`;a.click();URL.revokeObjectURL(url);
    showToast("💾 저장 완료!");
  }catch(e){showToast("저장 실패");}
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
    if(d.themes)themes=d.themes;if(d.memos)memos=d.memos;
    if(d.stickyNotes)stickyNotes=d.stickyNotes;if(d.regionOrders)regionOrders=d.regionOrders;
    save();saveSticky();saveRegOrd();showToast("📤 불러오기 완료!");render();
  }catch(err){showToast("파일 읽기 실패");}};
  r.readAsText(file);e.target.value="";
}

function renderStars(rating, color="#FFB800") {
  rating = parseInt(rating) || 0;
  return [1,2,3,4,5].map(i => `<span style="color:${i<=rating?color:'#ddd'}">${i<=rating?'★':'☆'}</span>`).join('');
}
// 별점 인라인 텍스트
function starsText(rating) {
  rating = parseInt(rating) || 0;
  return '★'.repeat(rating) + '☆'.repeat(5-rating);
}

function shouldShowStar(themeId, status) {
  if(!STAR_THEMES[themeId]) return false;
  return STAR_THEMES[themeId].includes(status);
}

function buildMemoItem(m, theme) {
  const isWatchedTheme = activeTheme === "movie";
  const watched = isWatchedTheme && m.status === "봤다";
  const hasStar = shouldShowStar(activeTheme, m.status) && parseInt(m.rating||0) > 0;
  const starsHtml = hasStar ? `<div class="mc-stars-inline">${starsText(m.rating)}</div>` : '';
  return `<div class="mc">
    <div class="mc-info" data-view="${m.id}">
      <div class="mc-title${watched?" watched":""}">${esc(m.title)}</div>
      ${starsHtml}
    </div>
    <span class="mc-date">${m.date||""}</span>
    <div class="mc-acts"><button data-edit="${m.id}">✏️</button><button data-delete="${m.id}">🗑️</button></div>
  </div>`;
}

function buildMemoListHTML(filtered,theme){
  if(!filtered.length) return `<div class="empty"><div class="ei">${theme.icon}</div><div class="et">아직 메모가 없어요</div><div class="es">+ 추가 버튼으로 등록하세요</div></div>`;
  const show=showAllList?filtered:filtered.slice(0,LIST_MAX);
  let html=`<div class="memo-list">${show.map(m=>buildMemoItem(m,theme)).join("")}</div>`;
  if(filtered.length>LIST_MAX){
    html+=`<button class="list-more-btn" id="btn-list-more">${showAllList?"▲ 접기":`▼ 더보기 (${filtered.length-LIST_MAX}개 더)`}</button>`;
  }
  return html;
}

function buildRegionGroups(filtered,theme){
  if(!filtered.length) return `<div class="empty"><div class="ei">${theme.icon}</div><div class="et">아직 메모가 없어요</div><div class="es">+ 추가 버튼으로 등록하세요</div></div>`;
  const ro=regionOrders[activeTheme]||{};
  const groups={};
  filtered.forEach(m=>{const r=(m.region||"지역 미입력").trim()||"지역 미입력";if(!groups[r])groups[r]=[];groups[r].push(m);});
  const keys=Object.keys(groups).sort((a,b)=>{
    if(a==="지역 미입력")return 1;if(b==="지역 미입력")return -1;
    const oa=ro[a]!==undefined?ro[a]:9999,ob=ro[b]!==undefined?ro[b]:9999;
    return oa!==ob?oa-ob:a.localeCompare(b,"ko");
  });
  const expSet=expandedRegions[activeTheme]||new Set();
  let html=`<div class="region-group">`;
  keys.forEach(r=>{
    const items=groups[r],isExp=expSet.has(r);
    const orderLabel=ro[r]!==undefined?` <span style="font-size:10px;color:#bbb;background:#f0ede6;padding:1px 6px;border-radius:8px">No.${ro[r]}</span>`:"";
    html+=`<div class="region-hdr"><span>📍</span><span class="region-hdr-name">${esc(r)}${orderLabel}</span><span class="region-hdr-count">${items.length}곳</span><div class="region-divider"></div></div>`;
    const show=isExp?items:items.slice(0,REGION_MAX);
    html+=`<div class="memo-list">${show.map(m=>buildMemoItem(m,theme)).join("")}`;
    if(items.length>REGION_MAX){
      html+=`<button class="region-more-btn" data-region-more="${esc(r)}">${isExp?"▲ 접기":`▼ 더보기 (${items.length-REGION_MAX}개 더)`}</button>`;
    }
    html+=`</div>`;
  });
  html+=`</div>`;
  return html;
}

function onModalStatusChange(val){
  modalRating = 0; // 상태 바꾸면 별점 초기화
  const starRowEl = document.getElementById("star-row");
  if(!starRowEl) return;
  const showStar = shouldShowStar(activeTheme, val);
  if(showStar){
    starRowEl.innerHTML = `<label class="f-lbl">별점</label>
    <div class="star-row">${[1,2,3,4,5].map(i=>`<button type="button" class="star-btn" data-star="${i}" style="color:#ddd">☆</button>`).join("")}</div>`;
    starRowEl.querySelectorAll("[data-star]").forEach(btn=>{
      btn.addEventListener("click",()=>{ setModalRating(parseInt(btn.dataset.star)); });
    });
  } else {
    starRowEl.innerHTML = '';
  }
}

function setModalRating(val){
  modalRating = val;
  document.querySelectorAll(".star-btn").forEach(btn=>{
    const n=parseInt(btn.dataset.star);
    btn.textContent = n<=val?'★':'☆';
    btn.style.color = n<=val?'#FFB800':'#ddd';
  });
}

function addTodo(){
  const title=document.getElementById("todo-inp")?.value?.trim();if(!title){document.getElementById("todo-inp")?.focus();return;}
  const tid=document.getElementById("todo-cat")?.value||"daily";
  const status=document.getElementById("todo-status")?.value||"미완료";
  const date=document.getElementById("todo-date")?.value||TODAY;
  if(!memos[tid])memos[tid]=[];
  memos[tid].unshift({id:Date.now().toString(),title,note:"",status,date});
  save();render();setTimeout(()=>document.getElementById("todo-inp")?.focus(),30);
}
function commitEdit(id){
  const val=document.getElementById("tedit-inp")?.value?.trim();if(!val)return;
  for(const k of Object.keys(memos)){const i=(memos[k]||[]).findIndex(m=>m.id===id);if(i!==-1){memos[k][i].title=val;break;}}
  todoEditId=null;save();render();
}
function cancelEdit(){todoEditId=null;render();}
function toggleTodo(id){
  for(const k of Object.keys(memos)){const m=(memos[k]||[]).find(m=>m.id===id);if(m){m.status=m.status==="완료"?"미완료":"완료";break;}}
  save();render();
}
function deleteTodo(id){
  for(const k of Object.keys(memos)){const b=(memos[k]||[]).length;memos[k]=(memos[k]||[]).filter(m=>m.id!==id);if((memos[k]||[]).length!==b)break;}
  save();render();
}
function submitPin(){
  const val=document.getElementById("pin-inp")?.value||"";
  if(val.length<4){pinError="4자리를 입력해주세요";render();setTimeout(()=>document.getElementById("pin-inp")?.focus(),30);return;}
  const{action,themeId}=pinModal;
  if(action==="setup"){locks[themeId]=val;saveLocks();pinModal=null;pinError="";showToast("🔒 잠금 설정 완료");render();}
  else if(action==="enter"){
    if(locks[themeId]===val){pinModal=null;pinError="";activeTheme=themeId;view="detail";filterStatus="전체";showSearch=false;searchText="";showAllList=false;expandedRegions={};saveViewState();render();history.pushState({},""  );}
    else{pinError="비밀번호가 틀렸어요";render();setTimeout(()=>document.getElementById("pin-inp")?.focus(),30);}
  } else {
    if(locks[themeId]===val){delete locks[themeId];saveLocks();pinModal=null;pinError="";showToast("🔓 잠금 해제 완료");render();}
    else{pinError="비밀번호가 틀렸어요";render();setTimeout(()=>document.getElementById("pin-inp")?.focus(),30);}
  }
}
function saveMemoModal(){
  const title=document.getElementById("mm-title")?.value?.trim();if(!title)return;
  const note=document.getElementById("mm-note")?.value||"";
  const date=document.getElementById("mm-date")?.value||TODAY;
  const theme=themes.find(t=>t.id===activeTheme);
  const statusEl=document.getElementById("mm-status");
  const status=statusEl?statusEl.value:(modalMemo.status||theme.defaultStatus||"");
  // 별점 저장
  const rating = shouldShowStar(activeTheme, status) ? (modalRating || parseInt(modalMemo.rating||0)) : 0;
  const extra={};
  document.querySelectorAll("[data-field]").forEach(inp=>{extra[inp.dataset.field]=inp.value;});
  if(REGION_THEMES.includes(activeTheme)){
    const regionVal=(document.getElementById("f-region")?.value||"").trim();
    const orderVal=document.getElementById("f-region-order")?.value||"";
    extra.region=regionVal;
    if(regionVal&&orderVal!==""){setRegionOrder(activeTheme,regionVal,parseInt(orderVal,10));}
    extra.regionOrder=orderVal?parseInt(orderVal,10):"";
  }
  const m={title,note,status,date,rating,...extra};
  if(!memos[activeTheme])memos[activeTheme]=[];
  if(modalEditId){memos[activeTheme]=memos[activeTheme].map(x=>x.id===modalEditId?{...x,...m}:x);}
  else{memos[activeTheme].unshift({...m,id:Date.now().toString()});}
  showModal=false;modalEditId=null;modalRating=0;save();render();
}

    srchInp.addEventListener("input",e=>{if(!composing){searchText=e.target.value;renderListOnly();}});
  }

  document.querySelectorAll("[data-tab]").forEach(btn=>{btn.addEventListener("click",()=>{filterStatus=btn.dataset.tab;showAllList=false;saveViewState();render();});});

  $("f-region")?.addEventListener("input",e=>{
    const rv=e.target.value.trim(),oi=$("f-region-order");if(!oi)return;
    const ex=getRegionOrder(activeTheme,rv);
    if(rv&&ex!==null){oi.value=ex;}
    else if(!rv){oi.value="";}
  });

  $("todo-cat")?.addEventListener("change",()=>{
    const t=themes.find(th=>th.id===$("todo-cat").value);if(!t)return;
    const sel=$("todo-status");
    sel.innerHTML=t.statusOptions.map(s=>`<option value="${s}">${s}</option>`).join("");
    sel.style.background=t.bg;sel.style.color=t.color;sel.style.borderColor=t.color+"40";
  });
  $("todo-inp")?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addTodo();}});
  $("btn-tadd")?.addEventListener("click",addTodo);
  $("btn-more-pend")?.addEventListener("click",()=>{showAllPend=!showAllPend;render();});
  $("btn-more-done")?.addEventListener("click",()=>{showAllDone=!showAllDone;render();});
  document.querySelectorAll("[data-check]").forEach(cb=>{cb.addEventListener("click",()=>toggleTodo(cb.dataset.check));});
  document.querySelectorAll("[data-edit-todo]").forEach(btn=>{btn.addEventListener("click",()=>{todoEditId=btn.dataset.editTodo;render();setTimeout(()=>$("tedit-inp")?.focus(),30);});});
  document.querySelectorAll("[data-del-todo]").forEach(btn=>{btn.addEventListener("click",()=>deleteTodo(btn.dataset.delTodo));});

  $("btn-add-modal")?.addEventListener("click",()=>{
    const t=themes.find(t=>t.id===activeTheme);
    modalMemo={title:"",note:"",status:t.defaultStatus||"",date:TODAY,rating:0};
    (t.fields||[]).forEach(f=>{modalMemo[f.key]="";});
    modalEditId=null;modalRating=0;showModal=true;render();history.pushState({},""  );
  });
  $("btn-save-modal")?.addEventListener("click",saveMemoModal);
  $("btn-cancel-modal")?.addEventListener("click",()=>{showModal=false;modalEditId=null;modalRating=0;render();});
  $("modal-bg-memo")?.addEventListener("click",e=>{if(e.target.id==="modal-bg-memo"){showModal=false;modalEditId=null;modalRating=0;render();}});

  // 별점 버튼 (모달)
  document.querySelectorAll(".star-btn").forEach(btn=>{
    btn.addEventListener("click",()=>setModalRating(parseInt(btn.dataset.star)));
  });

  // 뷰 모달
  $("btn-vm-close")?.addEventListener("click",()=>{showViewModal=false;viewMemoData=null;render();});
  $("vm-bg")?.addEventListener("click",e=>{if(e.target.id==="vm-bg"){showViewModal=false;viewMemoData=null;render();}});
  $("btn-vm-edit")?.addEventListener("click",()=>{
    if(!viewMemoData) return;
    const m=viewMemoData;
    modalMemo={...m};modalEditId=m.id;modalRating=parseInt(m.rating||0);
    showViewModal=false;viewMemoData=null;showModal=true;render();history.pushState({},""  );
  });

  $("btn-cancel-del")?.addEventListener("click",()=>{pendingDelete=null;render();});
  $("confirm-bg")?.addEventListener("click",e=>{if(e.target.id==="confirm-bg"){pendingDelete=null;render();}});
  $("btn-confirm-del")?.addEventListener("click",()=>{memos[activeTheme]=(memos[activeTheme]||[]).filter(m=>m.id!==pendingDelete);pendingDelete=null;save();render();});

  bindListBtns();
}

function bindListBtns(){
  document.querySelectorAll("[data-view]").forEach(el=>{
    el.addEventListener("click",()=>{
      const m=(memos[activeTheme]||[]).find(x=>x.id===el.dataset.view);
      if(m){viewMemoData={...m};showViewModal=true;render();history.pushState({},""  );}
    });
  });
  document.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const m=(memos[activeTheme]||[]).find(x=>x.id===btn.dataset.edit);
      if(m){modalMemo={...m};modalEditId=m.id;modalRating=parseInt(m.rating||0);showModal=true;render();history.pushState({},"");}
    });
  });
  document.querySelectorAll("[data-delete]").forEach(btn=>{btn.addEventListener("click",()=>{pendingDelete=btn.dataset.delete;render();});});
  document.getElementById("btn-list-more")?.addEventListener("click",()=>{showAllList=!showAllList;renderListOnly();});
  document.querySelectorAll("[data-region-more]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const r=btn.dataset.regionMore;
      if(!expandedRegions[activeTheme])expandedRegions[activeTheme]=new Set();
      if(expandedRegions[activeTheme].has(r))expandedRegions[activeTheme].delete(r);
      else expandedRegions[activeTheme].add(r);
      renderListOnly();
    });
  });
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

restoreViewState();
render();
</script>
</body>
</html>
